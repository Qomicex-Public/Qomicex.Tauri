packages:
  - 'packages/*'
# esbuild 的平台二进制由 optionalDependencies(@esbuild/<platform>) 提供，无需 postinstall。
# 两个构建脚本开关必须保持一致——旧配置里 allowBuilds=false 与
# onlyBuiltDependencies=[esbuild] 互相矛盾，新克隆机行为不可预期。
allowBuilds:
  esbuild: true
onlyBuiltDependencies:
  - esbuild
overrides:
  '@qomicex/cli': link:packages/qomicex-cli
  # 传递依赖的安全修复（pnpm audit）：source-map-js / postcss-selector-parser。
  # braces 的 advisory（GHSA-vfj7-8cjw-p6xm）无已发布修复版本，只能随
  # tailwindcss v3 → v4 迁移消除。
  source-map-js: 1.2.2
  postcss-selector-parser: 7.1.6

<div id="root">
  <div style="padding:24px;max-width:420px">
    <h1 style="font-size:18px;font-weight:700;margin:0 0 4px">AI 助手</h1>
    <p style="font-size:13px;color:var(--muted-foreground,#888);margin:0 0 16px">L3 插件 · 点击打开悬浮聊天窗</p>
    <button id="openBtn" style="width:100%;padding:10px 0;border-radius:8px;border:1px solid var(--border,#333);background:var(--primary,#6c8cff);color:#fff;font-size:14px;font-weight:500;cursor:pointer">打开悬浮窗</button>
    <div id="status" style="margin-top:12px;font-size:12px;color:var(--muted-foreground,#888);text-align:center"></div>
  </div>
</div>
<script>
function getChatHTML() {
  return '<div style=\"display:flex;flex-direction:column;height:100%;font-size:13px\">' +
    '<div id=\"chat-msgs\" style=\"flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px\">' +
      '<div style=\"align-self:flex-start;background:var(--muted,#1e1e22);color:var(--foreground,#eee);padding:8px 12px;border-radius:8px;max-width:80%\">' +
        '你好！我是 AI 助手，有什么可以帮你的？' +
      '</div>' +
    '</div>' +
    '<div style=\"display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border,#333)\">' +
      '<input id=\"chat-input\" style=\"flex:1;background:var(--muted,#1e1e22);border:1px solid var(--border,#333);border-radius:6px;padding:6px 10px;color:var(--foreground,#eee);font-size:13px;outline:none\" placeholder=\"输入消息...\">' +
      '<button id=\"chat-send\" style=\"background:var(--primary,#6c8cff);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer\">发送</button>' +
    '</div>' +
  '</div>'
}

var mockReplies = [
  '这是个好问题！让我想想... 根据我的计算，答案是 42。',
  '明白了。我建议你先检查一下配置文件，通常问题出在路径上。',
  '哈哈，这个梗我懂！不过认真说，重启大法能解决 90% 的问题。',
  '让我查一下资料库... 嗯，这个功能在 2.0 版本已经支持了。',
  '收到！正在帮你处理... 好了，已经搞定了，你再试试看。',
  '这个问题涉及到一些底层原理。简单来说，Java 的类加载机制导致了这个现象。',
  '其实 @Qomicex 团队已经注意到了这个问题，预计下个版本会修复。',
  '建议你去看看文档，里面有详细的说明。要我帮你打开吗？',
  '这个模组的配置文件在 .minecraft/config/ 目录下，用文本编辑器打开就行。',
  '好问题！实际上，这个特性是由 Forge 的 Mixin 系统实现的。',
  'emmmm... 让我组织一下语言。简单地说：不行。',
  '技术上可以实现，但是考虑到兼容性，我们选择了更保守的方案。',
  '按一下 F3 键，你会看到很多东西。找到那个标了 FPS 的数字就是了。',
  'Java 17 确实比 Java 8 快很多，但有些老模组不兼容。这是个 trade-off。',
  '查到了！这个 bug 的原因是 Minecraft 的渲染管线在处理透明贴图时的顺序问题。',
]

function getRandomReply() {
  return mockReplies[Math.floor(Math.random() * mockReplies.length)]
}

function scrollToBottom(container) {
  container.scrollTop = container.scrollHeight
}

function addMessage(container, text, isUser) {
  var div = document.createElement('div')
  div.style.cssText = 'align-self:' + (isUser ? 'flex-end' : 'flex-start') + ';background:' + (isUser ? 'var(--primary,#6c8cff)' : 'var(--muted,#1e1e22)') + ';color:' + (isUser ? '#fff' : 'var(--foreground,#eee)') + ';padding:8px 12px;border-radius:8px;max-width:80%;white-space:pre-wrap;word-break:break-word'
  div.textContent = text
  container.appendChild(div)
  scrollToBottom(container)
}

function addTypingIndicator(container) {
  var div = document.createElement('div')
  div.id = 'typing-indicator'
  div.style.cssText = 'align-self:flex-start;background:var(--muted,#1e1e22);color:var(--muted-foreground,#888);padding:8px 12px;border-radius:8px;font-size:12px'
  div.textContent = 'AI 正在输入...'
  container.appendChild(div)
  scrollToBottom(container)
  return div
}

function removeTypingIndicator() {
  var el = document.getElementById('typing-indicator')
  if (el) el.remove()
}

function setupChat() {
  var input = document.getElementById('chat-input')
  var sendBtn = document.getElementById('chat-send')
  var msgs = document.getElementById('chat-msgs')
  if (!input || !sendBtn || !msgs) return

  function send() {
    var text = input.value.trim()
    if (!text) return
    input.value = ''
    addMessage(msgs, text, true)
    addTypingIndicator(msgs)
    setTimeout(function() {
      removeTypingIndicator()
      addMessage(msgs, getRandomReply(), false)
    }, 800 + Math.random() * 1200)
  }

  sendBtn.addEventListener('click', send)
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') send() })
  setTimeout(function() { input.focus() }, 300)
}

function openOverlay() {
  var statusEl = document.getElementById('status')
  if (statusEl) statusEl.textContent = '正在打开悬浮窗...'

  window.__PLUGIN_API__.call('overlay.create', {
    title: 'AI 助手',
    html: getChatHTML(),
    width: 380,
    height: 500,
    x: 120,
    y: 80
  }).then(function() {
    if (statusEl) statusEl.textContent = '悬浮窗已打开'
    setTimeout(function() {
      if (statusEl) statusEl.textContent = ''
    }, 2000)
  })
}

document.getElementById('openBtn').addEventListener('click', openOverlay)
</script>

<div id="root">
  <div style="padding:16px 24px;max-width:480px">
    <h1 style="font-size:18px;font-weight:700;margin:0 0 4px">启动梗王</h1>
    <p style="font-size:13px;color:var(--muted-foreground,#888);margin:0 0 16px">
      L3 插件 · 正在劫持启动文案...
    </p>

    <div style="border:1px solid var(--border,#333);border-radius:8px;padding:12px 16px">
      <p style="font-size:13px;font-weight:500;margin:0 0 8px">当前替换规则</p>
      <div id="rules" style="font-size:12px;color:var(--muted-foreground,#888);display:flex;flex-direction:column;gap:4px"></div>
    </div>
  </div>
</div>
<script>
var memes = {
  starting:     '正在唤醒矿工...',
  checking:     '用 TNT 检查文件完整性...',
  repairing:    '用命令方块修补中...',
  'logging-in': '正在验证你是不是史蒂夫...',
  authlib:      '配置外置登录——别问，问就是微软...',
  natives:      '解压原生库（苦力怕在帮忙）...',
  building:     '搭建红石计算机...',
  preparing:    '倒计时 3... 2... 1...',
  launching:    '发射地狱传送门...',
  running:      '史蒂夫已经进入游戏了！',
}

function updateRules() {
  var el = document.getElementById('rules')
  if (!el) return
  var stages = ['starting','checking','repairing','logging-in','authlib','natives','building','preparing','launching','running']
  el.innerHTML = stages.map(function(s) {
    var label = {starting:'准备中',checking:'检查文件',repairing:'补全文件','logging-in':'验证账户',authlib:'配置登录',natives:'解压原生库',building:'构建参数',preparing:'准备环境',launching:'启动游戏',running:'运行中'}[s] || s
    return '<div style=\"display:flex;justify-content:space-between\"><span>' + label + '</span><span style=\"color:var(--primary,#6c8cff)\">→ ' + memes[s] + '</span></div>'
  }).join('')
}
updateRules()

window.addEventListener('plugin:launch-progress-override', function(e) {
  var msg = memes[e.detail.stage]
  if (msg) e.detail.message = msg
})
</script>

[features]
default = []
# Mirrors the C# LICENSE_REQUIRED build flag: only when enabled is the closed
# license core (Ed25519 verify + remote check) compiled in.
license-required = [
  "dep:ed25519-dalek",
  "dep:hmac",
  "dep:pbkdf2",
  "dep:hkdf",
  "dep:aes-gcm",
]

[package]
name = "qomicex-backend"
version = "0.1.0"
edition = "2021"
description = "Qomicex standalone HTTP backend (Rust rewrite of Qomicex.Launcher.Backend.Neo)"
license = "GPL-3.0"

[[bin]]
name = "qomicex-backend"
path = "src/main.rs"

[dependencies]
qomicex-core = { package = "qomicex-core-rust", path = "../../qomicex-core-rust" }
qomicex-downloader = { path = "../../qomicex-downloader-rust" }
qomicex-connector = { path = "../../qomicex-connector-rust/crates/qomicex-connector" }

axum = { version = "0.8", features = ["multipart"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "fs", "process"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.30"
fontdb = "0.20"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
open = "5"

# --- License core (only when feature `license-required` is enabled) ---
ed25519-dalek = { version = "2", optional = true }
sha2 = "0.10"
hmac = { version = "0.12", optional = true }
pbkdf2 = { version = "0.12", optional = true }
hkdf = { version = "0.12", optional = true }
aes-gcm = { version = "0.10", optional = true }
base64 = "0.22"

# --- Plugin system ---
zip = { version = "2", default-features = false, features = ["deflate"] }
urlencoding = "2"
url = "2"

# --- Java 运行时下载解压 ---
tar = "0.4"
flate2 = "1"

md-5 = "0.10"

# --- 日志捕获（实时日志：stderr 重定向到 trace 缓冲）---
[target.'cfg(windows)'.dependencies]
# 仅 Windows：winreg 在非 Windows 平台编译即报 compile_error!
# （license_core.rs board_id 的 BIOS 读取；代码已有 cfg(windows) 保护）
winreg = "0.52"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true

[package]
name = "qomicex-launcher"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qomicex_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-process = "2"
# OS 级 qomicex-launcher:// 协议唤起（issue #127）。deep-link 负责「从 argv 解析 URL」，
# single-instance 负责「已有实例在跑时把新进程的 argv 转交过去」——两者必须配合：
# Windows/Linux 上深链是「新进程带 URL 参数启动」，没有单实例就只会多开一个窗口。
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
serde_json = "1"
wasmtime = "26"
wasmtime-wasi = "26"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"

# 自实现 IDropTarget 读取文本拖拽（authlib-injector 的 DnD 走 text/plain，
# 而 tauri/wry 的拖放处理器只认 CF_HDROP 文件，非文件直接丢弃不发事件）。
# 版本对齐 tauri 2.x 自身所用的 windows 0.61，避免同进程两套 windows 类型。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement(IDropTarget)]` 宏生成的代码引用 `::windows_core`，必须以直接依赖的形式
# 存在（wry/tao 同样这么做）。版本与上面的 windows 0.61 对齐。
windows-core = "0.61"

# Cranelift 没有 loongarch64 后端（bytecodealliance/wasmtime#9612，2024-11 提出至今
# 未实现，维护者明确表示需要有人志愿写完整后端）。cranelift-codegen 的 build.rs
# 会在编译期 panic：
#   error when identifying target: "no supported isa found for arch `loongarch64`"
#
# 该 build.rs 的判定是：
#   host_isa = CARGO_FEATURE_HOST_ARCH && !CARGO_FEATURE_ALL_NATIVE_ARCH
#   if isas.is_empty() || host_isa { isa_from_arch(TARGET).expect(...) }
# 而 wasmtime-cranelift 在依赖里硬编码了 cranelift-codegen 的 host-arch，
# 所以只加 pulley（让 isas 非空）不够——host_isa 仍为真，照样进 panic 分支。
#
# 必须启用 all-arch：它展开为 cranelift-codegen 的 all-native-arch + pulley，
# 既让 isas 非空，又把 all_native_arch 置真使 host_isa 为假，两条路都堵死。
# 代价是编进 x86/arm64/s390x/riscv64 + Pulley 全部后端，体积增大；
# 运行时 wasmtime 仍按宿主自动选 Pulley 解释器（官方文档：不支持 Cranelift 的
# 架构默认走 Pulley，功能与 Cranelift 对等，执行慢约一个数量级）。
# 插件 WASM 沙箱不是性能敏感路径，可接受。
# 只在 loongarch64 上启用，其余平台继续走原生 Cranelift。
[target.'cfg(target_arch = "loongarch64")'.dependencies]
wasmtime = { version = "26", features = ["all-arch"] }

[dev-dependencies]
semver = "1"


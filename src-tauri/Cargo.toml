[package]
name = "qomicex-launcher"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qomicex_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-process = "2"
# OS 级 qomicex-launcher:// 协议唤起（issue #127）。deep-link 负责「从 argv 解析 URL」，
# single-instance 负责「已有实例在跑时把新进程的 argv 转交过去」——两者必须配合：
# Windows/Linux 上深链是「新进程带 URL 参数启动」，没有单实例就只会多开一个窗口。
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
semver = "1"

# WASM 插件网关的运行时。loongarch64 上不可用，见下方 target 段的说明。
[target.'cfg(not(target_arch = "loongarch64"))'.dependencies]
wasmtime = "26"
wasmtime-wasi = "26"

# 自实现 IDropTarget 读取文本拖拽（authlib-injector 的 DnD 走 text/plain，
# 而 tauri/wry 的拖放处理器只认 CF_HDROP 文件，非文件直接丢弃不发事件）。
# 版本对齐 tauri 2.x 自身所用的 windows 0.61，避免同进程两套 windows 类型。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# `#[implement(IDropTarget)]` 宏生成的代码引用 `::windows_core`，必须以直接依赖的形式
# 存在（wry/tao 同样这么做）。版本与上面的 windows 0.61 对齐。
windows-core = "0.61"

# loongarch64 上不编译 WASM 插件网关，原因链（均已在 CI 实测确认）：
#   1. cranelift-codegen 无 loongarch64 后端（wasmtime#9612），build.rs 在
#      host-arch 开启且无匹配 ISA 时 panic：「no supported isa found for arch
#      `loongarch64`」。可用 all-arch feature 绕过（让 isas 非空且关掉 host_isa）。
#   2. 但 wasmtime-wasi 在依赖里硬编码了 wasmtime 的 async feature，无法关闭；
#      async → wasmtime-fiber，其栈切换是平台相关汇编，cfg_if 白名单只有
#      aarch64/x86_64/x86/arm/s390x/riscv64，loongarch64 直接 compile_error!
#      「fibers are not supported on this CPU architecture」。
# 第 2 条无法从本仓库绕过（只能换运行时或等上游实现 fiber），故该架构整体排除
# 插件网关：wasmtime / wasmtime-wasi 不参与编译，src/lib.rs 里 plugin_gateway
# 模块与其启动代码同样按 cfg 排除。龙芯平台上插件功能不可用，其余功能正常。
# 详见 docs/junsi-dev-docs/8-部署运维/构建部署.md 的 LoongArch64 小节。

[dev-dependencies]
semver = "1"


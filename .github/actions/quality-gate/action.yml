name: Quality gate
description: >
  release.yml / debug.yml 共用的质量门作业体（Rust 测试 + fmt + clippy + audit，
  以及前端 install / plugin-ui build / build / audit）。此前两个工作流逐字重复
  这段 68 行，仅 pnpm 版本一行不同并已因此产生漂移，故抽为单一实现。

  注意：这里的 clippy 保持 `--cap-lints warn`。该参数会让首方 lint 一并降级为
  warning，因此本步骤当前不会因 lint 失败而阻断发布——这是既有行为，有意保留；
  ci.yml 已改为 `--no-deps -- -D warnings` 并先以 continue-on-error 过渡，
  待 clippy 存量清零后，本步骤再同步收紧（否则 138 条存量会直接卡死发布）。

inputs:
  pat:
    description: 'GitHub PAT：connector 构建（easytier git 依赖认证）使用'
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2

    - name: Setup connector build
      id: connector
      uses: ./.github/actions/setup-connector-build
      with:
        pat: ${{ inputs.pat }}

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          protobuf-compiler \
          libglib2.0-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Cargo test
      shell: bash
      env:
        PROTOC: ${{ steps.connector.outputs.protoc-path }}
        VC_LTL: ""
        YY_THUNKS: ""
      run: cargo test --manifest-path src-backend/qomicex-backend/Cargo.toml

    - name: Tauri tests
      shell: bash
      run: cargo test --manifest-path src-tauri/Cargo.toml --lib plugin_gateway

    - name: Cargo fmt
      shell: bash
      env:
        PROTOC: ${{ steps.connector.outputs.protoc-path }}
      run: |
        cargo fmt --manifest-path src-backend/qomicex-backend/Cargo.toml -- --check
        cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

    - name: Cargo clippy
      shell: bash
      env:
        PROTOC: ${{ steps.connector.outputs.protoc-path }}
        VC_LTL: ""
        YY_THUNKS: ""
      run: |
        cargo clippy --manifest-path src-backend/qomicex-backend/Cargo.toml -- -D warnings --cap-lints warn
        cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings --cap-lints warn

    # 预编译二进制，省去 cargo install 源码编译（≈4-5 分钟）
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Cargo audit
      shell: bash
      run: |
        # easytier fork 锁定 hickory 0.25.2（endpoint-discovery 启用 dns-resolver）：
        # 0118 在 0.25 线无补丁版本，0119 需 0.26.1（breaking，需迁移 EasyTier4QML fork）。
        cd src-backend/qomicex-backend && cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119

    # 不传 version：pnpm 版本由 package.json 的 packageManager 决定。
    # 此前 debug.yml 各作业额外写 `version: 11`、release.yml 不写，两边漂移。
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: '22'
        cache: pnpm

    - name: Frontend install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build plugin-ui
      shell: bash
      run: pnpm --filter @qomicex/plugin-ui build

    - name: Frontend build
      shell: bash
      run: pnpm run build

    - name: Audit dependencies
      shell: bash
      run: |
        pnpm audit --audit-level moderate || true
        pnpm --filter @qomicex/plugin-ui audit --audit-level moderate || true

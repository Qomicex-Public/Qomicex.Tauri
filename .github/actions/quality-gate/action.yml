name: Quality gate
description: >
  release.yml / debug.yml 共用的质量门作业体（Rust 测试 + fmt + clippy + audit，
  以及前端 install / plugin-ui build / build / audit）。此前两个工作流逐字重复
  这段 68 行，仅 pnpm 版本一行不同并已因此产生漂移，故抽为单一实现。

  注意：这里的 clippy 保持 `--cap-lints warn`。该参数会让首方 lint 一并降级为
  warning，因此本步骤当前不会因 lint 失败而阻断发布——这是既有行为，有意保留；
  ci.yml 已改为 `--no-deps -- -D warnings` 并先以 continue-on-error 过渡，
  待 clippy 存量清零后，本步骤再同步收紧（否则 138 条存量会直接卡死发布）。

inputs:
  pat:
    description: 'GitHub PAT：connector 构建（easytier git 依赖认证）使用'
    required: true

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
    - uses: swatinem/rust-cache@v2

    - name: Setup connector build
      id: connector
      uses: ./.github/actions/setup-connector-build
      with:
        pat: ${{ inputs.pat }}

    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          protobuf-compiler \
          libglib2.0-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Cargo test
      shell: bash
      env:
        PROTOC: ${{ steps.connector.outputs.protoc-path }}
        VC_LTL: ""
        YY_THUNKS: ""
      run: cargo test --manifest-path src-backend/qomicex-backend/Cargo.toml

    - name: Tauri tests
      shell: bash
      run: cargo test --manifest-path src-tauri/Cargo.toml --lib plugin_gateway

    - name: Cargo fmt
      shell: bash
      env:
        PROTOC: ${{ steps.connector.outputs.protoc-path }}
      run: |
        cargo fmt --manifest-path src-backend/qomicex-backend/Cargo.toml -- --check
        cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

    - name: Cargo clippy
      shell: bash
      env:
        PROTOC: ${{ steps.connector.outputs.protoc-path }}
        VC_LTL: ""
        YY_THUNKS: ""
      run: |
        cargo clippy --manifest-path src-backend/qomicex-backend/Cargo.toml -- -D warnings --cap-lints warn
        cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings --cap-lints warn

    # 预编译二进制，省去 cargo install 源码编译（≈4-5 分钟）
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-audit

    - name: Cargo audit
      shell: bash
      run: |
        # ⚠️ 本步骤与 .github/workflows/ci.yml 的「Cargo audit」是**两份独立命令**
        # （release.yml / debug.yml 走本 composite action，CI 走 ci.yml）——
        # 改 ignore 列表必须两处同时改，否则会出现「CI 绿但 Release 红」。
        #
        # easytier fork 锁定 hickory 0.25.2（endpoint-discovery 启用 dns-resolver）：
        # 0118 在 0.25 线无补丁版本，0119 需 0.26.1（breaking，需迁移 EasyTier4QML fork）。
        #
        # 0367/0368/0369（zip 的 extract() symlink / SUID 提权，均 fixed >=9.0.0）：
        # 本仓与 core、Updater 的 zip 已升 9.0.4。剩余命中来自 easytier-proto 在
        # 9055aef 里写死的 `zip = "4.0.0"`（第三方 fork，本仓改不了），而它唯一的
        # extract() 调用在 `build = "build/main.rs"` 的构建脚本中——仅用于开发者本机
        # 解压 protoc，不进运行时二进制、不处理不可信输入，故不构成本项目的提权面。
        # 待 EasyTier4QML fork 升级 zip 后移除这三条 ignore。
        #
        # 0391/0398/0403/0410（zstd 0.13.3 / zstd-safe 7.2.4 / zstd-sys 2.0.16）：
        # 由 EasyTier4QML 的 easytier-core 运行时压缩与 easytier-proto → zip
        # 构建依赖引入，本仓不直接调用 zstd，升级需改第三方 fork 的依赖。
        # 0410 仅影响 wasm 分配器；0391/0398/0403 在 EasyTier 内部压缩/解压
        # 路径上暂时接受风险，待上游升级 zstd 依赖链后移除这四条 ignore。
        cd src-backend/qomicex-backend && cargo audit \
          --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 \
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 \
          --ignore RUSTSEC-2026-0369 --ignore RUSTSEC-2026-0391 \
          --ignore RUSTSEC-2026-0398 --ignore RUSTSEC-2026-0403 \
          --ignore RUSTSEC-2026-0410

    # 不传 version：pnpm 版本由 package.json 的 packageManager 决定。
    # 此前 debug.yml 各作业额外写 `version: 11`、release.yml 不写，两边漂移。
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: '22'
        cache: pnpm

    - name: Frontend install
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build plugin-ui
      shell: bash
      run: pnpm --filter @qomicex/plugin-ui build

    - name: Frontend build
      shell: bash
      run: pnpm run build

    - name: Audit dependencies
      shell: bash
      run: |
        pnpm audit --audit-level moderate || true
        pnpm --filter @qomicex/plugin-ui audit --audit-level moderate || true

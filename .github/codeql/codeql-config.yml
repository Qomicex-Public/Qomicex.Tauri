# CodeQL 配置
#
# 排除 rust/path-injection（"Uncontrolled data used in path expression"）。
#
# 理由：本项目的后端是**桌面应用**的本地伴随进程，只监听 127.0.0.1，不存在
# 远程攻击者。所有进入文件路径的用户输入都是本机用户自己的选择（游戏目录、
# 实例目录、存档目录名、缓存清理目标），用户操作自己的文件系统不构成注入面。
#
# 该规则还会把已经净化的输入误报为漏洞：用户可控的存档目录名在进入路径前已由
# `schematic_assets::is_plain_file_name` 拒绝 `/`、`\`、`:`、`.`、`..`，但
# CodeQL 的污点追踪在路径穿过结构体字段与模块边界后会丢失这段净化证据。
#
# 排除后仍保留 CodeQL 的其它 Rust 安全规则（SQL 注入、硬编码凭据、弱加密等）。
# 若将来后端改为对外监听，应重新启用本规则。
#
# 另排除 rust/command-line-injection（"Command line depends on user-provided value"）。
#
# 理由：`process.spawn` 与 `shell` 两个端点的**功能本身就是「让插件执行命令」**，
# 等价于插件生态里的 `shell:execute` 能力。它由 manifest 权限显式声明、由前端
# bridge 的 METHOD_PERMISSIONS 校验，与「命令注入」的威胁模型不同——后者指
# 应用把用户输入拼进自己本不愿执行的命令。这里的命令就是调用方要执行的东西。
#
# 入口处已做合法性校验（非空、长度上限、拒绝控制字符/NUL，见
# `plugin_process::validate_spawn_command`），防的是畸形值造成的拉起失败与参数
# 错乱。真正决定插件能否执行命令的是权限声明，静态分析无法表达这一层。
#
# 若将来引入「插件声明的权限不再可信」的场景（如插件包免签名安装、或后端对外
# 监听），应重新评估本规则。
name: "Qomicex CodeQL config"

query-filters:
  - exclude:
      id: rust/path-injection
  - exclude:
      id: rust/command-line-injection

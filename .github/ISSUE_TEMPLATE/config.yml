    url: https://www.qomicex.top/
    about: "下载、安装、账号、联机等使用问题请先访问官网获取帮助渠道 | Visit the website for download, install, account and multiplayer help"
  - name: "🔐 安全问题 | Security Issues"
    url: https://github.com/Qomicex-Public/Qomicex.Tauri/security/advisories
    about: "涉及账号、密钥、远程代码执行等安全问题请走私密漏洞报告，不要公开提交 | Please report security issues privately instead of filing a public issue"

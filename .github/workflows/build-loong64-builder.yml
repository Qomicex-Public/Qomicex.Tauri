name: Build LoongArch64 Builder Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（如 v1.0.0 或 latest）'
        required: true
        default: 'latest'

env:
  IMAGE_NAME: qomicex-loong64-builder   # 镜像名称，可自定义
  DOCKERFILE: Dockerfile.loong64        # Dockerfile 路径

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送 GHCR 所需

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/loong64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/loong64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
          cache-from: type=gha,scope=loong64-builder
          cache-to: type=gha,mode=max,scope=loong64-builder

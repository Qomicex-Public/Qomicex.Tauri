name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  # 后端配置注入（issue #159）：appsettings.json 不再入库，由 build.rs 以
  # appsettings.example.json 为模板 + 这两个环境变量在构建期生成。
  # fork PR 上 secrets 不可用 → 展开为空串 → build.rs 回退模板基线，构建照常通过。
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
  MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Init i18n submodule
        env:
          QOMICEX_PAT: ${{ secrets.QOMICEX_PAT }}
        run: |
          git config --global url."https://x-access-token:${QOMICEX_PAT}@github.com/Qomicex-Public/".insteadOf "git@github.com:Qomicex-Public/"
          git submodule update --init --depth 1 qomicex-tauri-i18n
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm run build
      - run: pnpm audit --audit-level moderate || true

  backend-check:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Cargo test
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: cargo test --manifest-path src-backend/qomicex-backend/Cargo.toml
      - name: Tauri tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib plugin_gateway
      - name: Cargo fmt
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
        run: |
          cargo fmt --manifest-path src-backend/qomicex-backend/Cargo.toml -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # `--cap-lints warn` 只应作用于依赖；它会把本仓 crate 的 lint 一并封顶，
      # 导致 `-D warnings` 完全失效（旧配置下 136 条首方告警被吞）。
      # 存量告警见 AGENTS.md「Clippy 存量」；清理到 0 后去掉 continue-on-error。
      - name: Cargo clippy (first-party)
        continue-on-error: true
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          cargo clippy --manifest-path src-backend/qomicex-backend/Cargo.toml --no-deps -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings
      # 预编译二进制，省去 cargo install 源码编译（≈4-5 分钟）
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit
        run: |
          # ⚠️ 本步骤与 .github/actions/quality-gate/action.yml 的「Cargo audit」
          # 是**两份独立命令**（CI 走这里，release.yml / debug.yml 走 composite
          # action）——改 ignore 列表必须两处同时改，否则会出现「CI 绿但 Release 红」。
          #
          # easytier fork 锁定 hickory 0.25.2（endpoint-discovery 启用 dns-resolver）：
          # 0118 在 0.25 线无补丁版本，0119 需 0.26.1（breaking，需迁移 EasyTier4QML fork）。
          #
          # 0367/0368/0369（zip 的 extract() symlink / SUID 提权，均 fixed >=9.0.0）：
          # 本仓与 core、Updater 的 zip 已升 9.0.4。剩余命中来自 easytier-proto 在
          # 9055aef 里写死的 `zip = "4.0.0"`（第三方 fork，本仓改不了），而它唯一的
          # extract() 调用在 `build = "build/main.rs"` 的构建脚本中——仅用于开发者本机
          # 解压 protoc，不进运行时二进制、不处理不可信输入，故不构成本项目的提权面。
          # 待 EasyTier4QML fork 升级 zip 后移除这三条 ignore。
          cd src-backend/qomicex-backend && cargo audit \
            --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119 \
            --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Run API filter tests
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          set +e
          cargo run --manifest-path src-backend/qomicex-backend/Cargo.toml &
          BACKEND_PID=$!
          trap "kill $BACKEND_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done
          bash scripts/test-api-filters.sh
          TEST_EXIT=$?
          kill $BACKEND_PID 2>/dev/null || true
          wait $BACKEND_PID 2>/dev/null || true
          exit $TEST_EXIT

  plugin-ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm --filter @qomicex/plugin-ui audit --audit-level moderate || true

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 与 frontend-check 相同：src/i18n 与 src/plugins/plugin-api.ts 经
      # ../../qomicex-tauri-i18n/src 引用翻译资源，缺了它 tsc 直接报 Cannot find module。
      - name: Init i18n submodule
        env:
          QOMICEX_PAT: ${{ secrets.QOMICEX_PAT }}
        run: |
          git config --global url."https://x-access-token:${QOMICEX_PAT}@github.com/Qomicex-Public/".insteadOf "git@github.com:Qomicex-Public/"
          git submodule update --init --depth 1 qomicex-tauri-i18n
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      # typecheck 是硬门禁：tsc 全绿（含 noUnusedLocals/noUnusedParameters）。
      - run: pnpm run typecheck
      # updateChannel 的回归（版本前缀大小写须与后端 strip_v 一致，见 ADR-085 v1.2）。
      # 零依赖脚本：用仓库自带 tsc 编译真实源码后断言，不是测试框架。
      - run: pnpm run test:update-channel
      # 深链解析的安全边界回归（路径穿越绕白名单 / 非法编码抛错 / 同名实例被静默乱挑）。
      # 同样是用仓库自带 tsc 编译真实源码后断言，不依赖 Node 的类型剥离。
      - run: pnpm run test:deep-link
      # 步骤名 i18n 覆盖护栏：后端安装管线里的 step id 必须在 downloads.steps 有词条，
      # 否则下载中心卡片直接显示 `downloads.steps.<id>` 键名（Technic Solder 期3 漏过 4 个）。
      - run: pnpm run test:i18n-steps
      # 插件主题同步的注册/注销配对护栏：registerThemeSync 的返回值丢弃会让已卸载
      # 的 iframe 被模块级 Set 永久持有（每次启用/禁用循环泄漏一个 iframe 及其 DOM）。
      - run: pnpm run test:plugin-theme-sync
      # 插件 iframe 宿主生命周期（issue #260）：srcdoc iframe 只有进入文档才执行脚本，
      # 库插件的宿主若不常驻，registerMethod 永不注册、callPlugin 全部静默失败。
      - run: pnpm run test:plugin-sandbox-host
      # l4 独立窗口插件的方法注册（issue #260）：窗口自带 top，注册只留在本地，
      # 主窗口 callPlugin 永远查不到。桥逻辑纯函数化，用内存总线验证往返/超时/同步抛错。
      - run: pnpm run test:plugin-l4-registry
      # l4 桥监听器安装的回滚语义：部分失败必须解绑已成功的，否则重试会重复注册，
      # 同一个 plugin-l4-api-call 被处理两次（非幂等操作产生重复副作用）。
      - run: pnpm run test:plugin-l4-bridge-init
      # 流式通道请求头（issue #262）：IPC 分支不像 fetch 那样自动生成 Content-Type，
      # 缺了后端 Json 提取器恒 415，插件的流式能力会静默失效。
      - run: pnpm run test:plugin-ipc-stream-headers
      # 插件 API 面（issue #264）：白名单/switch/权限目录/桥具名方法四份清单若漂移，
      # 插件侧只会看到「方法不存在」或调用挂起，人工测试极难覆盖。
      - run: pnpm run test:plugin-api-surface
      # 快捷安装前置计划的护栏（issue #249）：已安装的前置不得进入删除名单。
      # 该判定此前用本地文件名与上游文件名比较，两域必然不等 → 已装前置被删且不补下载。
      - run: pnpm run test:dependency-install-plan
      # 版权头护栏（issue #248）：源文件须带 GPL-3.0-or-later 的 SPDX 声明。
      # 缺头就失败，避免新增文件再次无声明（CLI 模板与 plugins-dev 为有意例外，见脚本）。
      - run: pnpm run license:check
      # lint 尚未进阻断：存量见 AGENTS.md「Lint 现状」，清零后再去掉 continue-on-error。
      - name: ESLint
        continue-on-error: true
        run: pnpm run lint
      - name: Prettier check
        continue-on-error: true
        run: pnpm run format:check

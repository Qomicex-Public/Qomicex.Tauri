name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Init i18n submodule
        env:
          QOMICEX_PAT: ${{ secrets.QOMICEX_PAT }}
        run: |
          git config --global url."https://x-access-token:${QOMICEX_PAT}@github.com/Qomicex-Public/".insteadOf "git@github.com:Qomicex-Public/"
          git submodule update --init --depth 1 qomicex-tauri-i18n
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm run build
      - run: pnpm audit --audit-level moderate || true

  backend-check:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Cargo test
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: cargo test --manifest-path src-backend/qomicex-backend/Cargo.toml
      - name: Tauri tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib plugin_gateway
      - name: Cargo fmt
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
        run: |
          cargo fmt --manifest-path src-backend/qomicex-backend/Cargo.toml -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      # `--cap-lints warn` 只应作用于依赖；它会把本仓 crate 的 lint 一并封顶，
      # 导致 `-D warnings` 完全失效（旧配置下 136 条首方告警被吞）。
      # 存量告警见 AGENTS.md「Clippy 存量」；清理到 0 后去掉 continue-on-error。
      - name: Cargo clippy (first-party)
        continue-on-error: true
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          cargo clippy --manifest-path src-backend/qomicex-backend/Cargo.toml --no-deps -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --no-deps -- -D warnings
      # 预编译二进制，省去 cargo install 源码编译（≈4-5 分钟）
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Cargo audit
        run: |
          # easytier fork 锁定 hickory 0.25.2（endpoint-discovery 启用 dns-resolver）：
          # 0118 在 0.25 线无补丁版本，0119 需 0.26.1（breaking，需迁移 EasyTier4QML fork）。
          cd src-backend/qomicex-backend && cargo audit --ignore RUSTSEC-2026-0118 --ignore RUSTSEC-2026-0119
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Run API filter tests
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          set +e
          cargo run --manifest-path src-backend/qomicex-backend/Cargo.toml &
          BACKEND_PID=$!
          trap "kill $BACKEND_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done
          bash scripts/test-api-filters.sh
          TEST_EXIT=$?
          kill $BACKEND_PID 2>/dev/null || true
          wait $BACKEND_PID 2>/dev/null || true
          exit $TEST_EXIT

  plugin-ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm --filter @qomicex/plugin-ui audit --audit-level moderate || true

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 与 frontend-check 相同：src/i18n 与 src/plugins/plugin-api.ts 经
      # ../../qomicex-tauri-i18n/src 引用翻译资源，缺了它 tsc 直接报 Cannot find module。
      - name: Init i18n submodule
        env:
          QOMICEX_PAT: ${{ secrets.QOMICEX_PAT }}
        run: |
          git config --global url."https://x-access-token:${QOMICEX_PAT}@github.com/Qomicex-Public/".insteadOf "git@github.com:Qomicex-Public/"
          git submodule update --init --depth 1 qomicex-tauri-i18n
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      # typecheck 是硬门禁：tsc 全绿（含 noUnusedLocals/noUnusedParameters）。
      - run: pnpm run typecheck
      # lint 尚未进阻断：存量见 AGENTS.md「Lint 现状」，清零后再去掉 continue-on-error。
      - name: ESLint
        continue-on-error: true
        run: pnpm run lint
      - name: Prettier check
        continue-on-error: true
        run: pnpm run format:check

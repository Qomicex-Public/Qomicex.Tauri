name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm run build
      - run: pnpm audit --audit-level moderate || true

  backend-check:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            protobuf-compiler \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Cargo check
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: cargo check --manifest-path src-backend/qomicex-backend/Cargo.toml
      - name: Cargo test
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: cargo test --manifest-path src-backend/qomicex-backend/Cargo.toml
      - name: Tauri tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib plugin_gateway
      - name: Cargo fmt
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
        run: |
          cargo fmt --manifest-path src-backend/qomicex-backend/Cargo.toml -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Cargo clippy
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          cargo clippy --manifest-path src-backend/qomicex-backend/Cargo.toml -- -D warnings --cap-lints warn
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings --cap-lints warn
      - name: Cargo audit
        run: cargo install cargo-audit && cargo audit --manifest-path src-backend/qomicex-backend/Cargo.toml
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl
      - name: Run API filter tests
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          set +e
          cargo run --manifest-path src-backend/qomicex-backend/Cargo.toml &
          BACKEND_PID=$!
          trap "kill $BACKEND_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Backend ready"
              break
            fi
            sleep 2
          done
          bash scripts/test-api-filters.sh
          TEST_EXIT=$?
          kill $BACKEND_PID 2>/dev/null || true
          wait $BACKEND_PID 2>/dev/null || true
          exit $TEST_EXIT

  plugin-ui-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm --filter @qomicex/plugin-ui audit --audit-level moderate || true

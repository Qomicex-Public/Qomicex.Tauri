        run: |
          # binaries/ 被 gitignore，CI checkout 后不存在，需先创建
          mkdir -p src-tauri/binaries
          mv src-backend/qomicex-backend/target/x86_64-unknown-linux-gnu/release/qomicex-backend src-tauri/binaries/backend
          # 自更新器（Qomicex.Updater submodule）：include_bytes 嵌入主程序

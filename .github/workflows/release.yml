name: Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: '主版本号'
        required: true
        default: '0'
      minor:
        description: '次版本号'
        required: true
        default: '1'
      patch:
        description: '补丁版本号'
        required: true
        default: '0'
      releaseType:
        description: '发布类型'
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
      releaseNum:
        description: '发布序数（仅 release/beta，如 release5 的 5）'
        required: false
        default: '1'
      licenseRequired:
        description: '启用许可证验证'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '标记为 GitHub Pre-release'
        required: false
        default: false
        type: boolean
      required:
        description: '强制更新（用户必须更新才能继续使用）'
        required: false
        default: false
        type: boolean
      buildPlatform:
        description: '构建平台（all=windows+linux+macos；all+loongarch64 额外构建龙芯）'
        required: true
        default: 'all'
        type: choice
        options:
          - windows
          - linux
          - macos
          - loongarch64
          - all
          - all+loongarch64
      linuxBundles:
        description: 'Linux 打包格式（仅 linux/all/all+loongarch64 时有效）'
        required: false
        default: 'appimage,deb,rpm'
        type: choice
        options:
          - appimage,deb,rpm
          - appimage,deb
          - appimage,rpm
          - deb,rpm
          - appimage
          - deb
          - rpm
      macosArch:
        description: 'macOS 架构（仅 macos/all/all+loongarch64 时有效）'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - arm64
          - x64
      windowsArch:
        description: 'Windows 架构（仅 windows/all/all+loongarch64 时有效）'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - arm64
          - x64
      linuxArch:
        description: 'Linux 架构（仅 linux/all/all+loongarch64 时有效）'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - arm64
          - x64
  release:
    types: [published]

env:
  CARGO_TERM_COLORS: always
  GITHUB_SHA: ${{ github.sha }}
  # 后端配置注入（issue #159）：appsettings.json 不再入库，由 build.rs 以
  # appsettings.example.json 为模板 + 这两个环境变量在构建期生成。
  # 未配置的 secret 展开为空串 → build.rs 视为「未提供」→ 回退模板基线（构建不失败）。
  CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
  MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.construct.outputs.version }}
      displayVersion: ${{ steps.construct.outputs.displayVersion }}
      releaseType: ${{ steps.construct.outputs.releaseType }}
      prerelease: ${{ steps.construct.outputs.prerelease }}
      licenseRequired: ${{ steps.construct.outputs.licenseRequired }}
      required: ${{ steps.construct.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}

      - name: Construct version
        id: construct
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAG="${TAG#v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "displayVersion=v$TAG" >> "$GITHUB_OUTPUT"
            TYPE=$(echo "$TAG" | sed -n 's/^[0-9.]*-\([a-z]*\)[0-9].*/\1/p')
            echo "releaseType=$TYPE" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
            echo "licenseRequired=false" >> "$GITHUB_OUTPUT"
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            RTYPE="${{ github.event.inputs.releaseType }}"
            MAJOR="${{ github.event.inputs.major }}"
            MINOR="${{ github.event.inputs.minor }}"
            PATCH="${{ github.event.inputs.patch }}"
            RNUM="${{ github.event.inputs.releaseNum }}"

            # 这些输入会拼进 VERSION 并流到持有 TAURI_SIGNING_PRIVATE_KEY 的
            # 步骤。虽然下游一律经 step env 传递、不拼进 run 体，仍在此按预期
            # 格式白名单校验一次：版本号只应是数字，releaseNum 只应是数字，
            # releaseType 只应是三个已知取值。不合格直接失败，不产生任何 tag。
            case "$RTYPE" in
              release|beta|alpha) ;;
              *) echo "::error::releaseType 非法: $RTYPE"; exit 1 ;;
            esac
            for pair in "major:$MAJOR" "minor:$MINOR" "patch:$PATCH" "releaseNum:$RNUM"; do
              name="${pair%%:*}"
              value="${pair#*:}"
              # releaseNum 可为空（非必填）；其余必须是纯数字
              if [ -z "$value" ] && [ "$name" = "releaseNum" ]; then continue; fi
              case "$value" in
                ''|*[!0-9]*) echo "::error::$name 必须是纯数字，实际: '$value'"; exit 1 ;;
              esac
            done

            if [ "$RTYPE" = "alpha" ]; then
              DATE=$(date +%Y%m%d)
              MAX_N=-1
              for TAG in $(git tag -l "v*-alpha${DATE}.*" 2>/dev/null); do
                N=$(echo "$TAG" | sed "s/.*alpha${DATE}\\.\\([0-9]*\\)/\\1/")
                if [ "$N" -gt "$MAX_N" ] 2>/dev/null; then MAX_N=$N; fi
              done
              BUILD=$((MAX_N + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha${DATE}.${BUILD}"
            else
              VERSION="${MAJOR}.${MINOR}.${PATCH}-${RTYPE}${RNUM}.0"
            fi

            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "displayVersion=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "releaseType=$RTYPE" >> "$GITHUB_OUTPUT"

            PR="${{ github.event.inputs.prerelease }}"
            if [ "$RTYPE" = "release" ]; then
              echo "prerelease=${PR}" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
            echo "licenseRequired=${{ github.event.inputs.licenseRequired }}" >> "$GITHUB_OUTPUT"
            echo "required=${{ github.event.inputs.required == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version files
        run: node scripts/bump-version.mjs "${{ steps.construct.outputs.version }}"

      - name: Show version
        run: |
          echo "Version: ${{ steps.construct.outputs.displayVersion }}"
          echo "Type: ${{ steps.construct.outputs.releaseType }}"
          echo "Prerelease: ${{ steps.construct.outputs.prerelease }}"
          echo "License: ${{ steps.construct.outputs.licenseRequired }}"
          echo "Required: ${{ steps.construct.outputs.required }}"

  quality-gate:
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - name: Quality gate
        uses: ./.github/actions/quality-gate
        with:
          pat: ${{ secrets.QOMICEX_PAT }}

  windows-x64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'windows' || github.event.inputs.buildPlatform == 'all' ||
         github.event.inputs.buildPlatform == 'all+loongarch64') &&
        (github.event.inputs.windowsArch == 'both' || github.event.inputs.windowsArch == 'x64'))
    # 与 quality-gate 并行：release 汇总时仍要求 gate 通过，坏产物不会发布
    needs: [setup]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with: { node-version: '22', cache: pnpm }
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
        shell: pwsh
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Build Rust backend
        shell: pwsh
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          $features = @()
          if ("${{ needs.setup.outputs.licenseRequired }}" -eq "true") { $features = @("--features", "license-required") }
          cargo build --release --manifest-path src-backend/qomicex-backend/Cargo.toml --target x86_64-pc-windows-msvc @features
      - name: Stage backend binary
        shell: pwsh
        run: |
          # binaries/ 被 gitignore，CI checkout 后不存在，需先创建
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Move-Item -Force src-backend/qomicex-backend/target/x86_64-pc-windows-msvc/release/qomicex-backend.exe src-tauri/binaries/backend.exe
          # Packet.dll: 需与后端 exe 同目录(npcap)，一并打进 binaries/
          Copy-Item -Force qomicex-connector-rust/easytier/third_party/x86_64/Packet.dll src-tauri/binaries/Packet.dll
          # wintun.dll: easytier TUN 模式（管理员运行）动态加载
          Copy-Item -Force qomicex-connector-rust/easytier/third_party/x86_64/wintun.dll src-tauri/binaries/wintun.dll
          # 自更新器（Qomicex.Updater submodule）：include_bytes 嵌入主程序
          cargo build --release --manifest-path Qomicex.Updater/Cargo.toml --target x86_64-pc-windows-msvc
          Copy-Item -Force Qomicex.Updater/target/x86_64-pc-windows-msvc/release/qomicex-updater.exe src-tauri/binaries/updater.exe
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      # tauri 用 `pnpm exec` 调起，不要写回 `pnpm run tauri -- build`：
      # pnpm 对 `--` 的剥离行为随版本而变（实测 11.11 剥离、11.19 原样透传给 CLI），
      # 透传时 clap 直接报 "unexpected argument 'build' found"（run 36157803787 全平台即此因挂掉）。
      - run: pnpm exec tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        shell: pwsh
        run: |
          $version = "${{ needs.setup.outputs.displayVersion }}"
          Write-Output "=== Bundle dir contents ==="
          $bundleDir = "src-tauri/target/release/bundle"
          Get-ChildItem -Recurse -Path $bundleDir | Select-Object FullName
          # createUpdaterArtifacts 产出 setup.exe.sig；从 sig 反推安装包名
          $sigFile = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.exe.sig" | Select-Object -First 1
          $platform = "windows-x86_64"
          if ($sigFile) {
            $exeName = $sigFile.Name -replace '\.sig$',''
            $signature = (Get-Content -Path $sigFile.FullName -Raw).Trim()
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$exeName"
            $fragment = @{ $platform = @{ url = $url; signature = $signature } }
          } else {
            Write-Warning "No .exe.sig found (TAURI_SIGNING_PRIVATE_KEY missing?); emitting unsigned fragment"
            $exe = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninst" } | Select-Object -First 1
            if (-not $exe) { throw "No installer found" }
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$($exe.Name)"
            $fragment = @{ $platform = @{ url = $url } }
          }
          $json = $fragment | ConvertTo-Json -Compress -Depth 10
          Set-Content -Path "update-fragment-$platform.json" -Value $json
          Write-Output "Fragment: $json"
      - name: Generate self-update package (windows-x86_64)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 走 step env 而非 run 体插值：workflow_dispatch 的版本输入会经
          # needs.setup.outputs.version 流到这里，run 体里的 ${{ }} 是文本拼接，
          # 构造的版本文本会在持有签名私钥的步骤里被执行。
          RELEASE_TAG: ${{ needs.setup.outputs.displayVersion }}
        run: |
          # 文件布局更新包：NSIS /S 静默安装到收集目录，打包安装后的目录内容
          $setup = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*setup.exe" | Where-Object { $_.Name -notmatch "uninst" } | Select-Object -First 1
          if (-not $setup) { throw "No NSIS setup.exe found" }
          $collect = Join-Path $env:RUNNER_TEMP "qomicex-install-collect"
          New-Item -ItemType Directory -Force $collect | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "nsis-install.log"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$collect" -Wait -PassThru -RedirectStandardError $log
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "NSIS silent install failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $collect "Qomicex Launcher.exe"))) { throw "NSIS silent install produced no launcher exe" }
          $pkg = "qomicex-update-windows-x86_64.zip"
          Compress-Archive -Path (Join-Path $collect '*') -DestinationPath $pkg -Force
          npx tauri signer sign $pkg
          Write-Output "self-update package: $pkg"
          # 自更新包索引条目：release 作业靠 update-package-fragment-*.json 合并
          # updates.json，缺这一步则该平台在索引里没有条目、自更新选不到包。
          $urlBase = "${{ github.server_url }}/${{ github.repository }}/releases/download/$env:RELEASE_TAG"
          $sig = (Get-Content -Path "$pkg.sig" -Raw).Trim()
          $fragment = @{ "windows-x86_64" = @{ url = "$urlBase/$pkg"; signature = $sig; strategy = "dir" } }
          $json = $fragment | ConvertTo-Json -Compress -Depth 10
          Set-Content -Path "update-package-fragment-windows-x86_64.json" -Value $json
          Write-Output "Fragment: $json"
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-windows-x64
          path: |
            qomicex-update-*.zip
            qomicex-update-*.zip.sig
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-fragment-${{ github.job }}
          path: update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: qomicex-launcher-windows-x64
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig

  windows-arm64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'windows' || github.event.inputs.buildPlatform == 'all' ||
         github.event.inputs.buildPlatform == 'all+loongarch64') &&
        (github.event.inputs.windowsArch == 'both' || github.event.inputs.windowsArch == 'arm64'))
    # 与 quality-gate 并行：release 汇总时仍要求 gate 通过，坏产物不会发布
    needs: [setup]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      # rust-toolchain.toml 钉住 1.95.0，dtolnay 动作只把 target 装进 `stable`；
      # cargo 在仓库目录内解析到被钉住的 1.95.0，交叉 target 缺失 → E0463 can't find crate for `core`。
      # rustup target add 不带 --toolchain 时按 rust-toolchain.toml 解析，正好装进 1.95.0。
      - name: Install cross target for pinned toolchain
        run: rustup target add aarch64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with: { node-version: '22', cache: pnpm }
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
        shell: pwsh
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Build Rust backend
        shell: pwsh
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          $features = @()
          if ("${{ needs.setup.outputs.licenseRequired }}" -eq "true") { $features = @("--features", "license-required") }
          cargo build --release --manifest-path src-backend/qomicex-backend/Cargo.toml --target aarch64-pc-windows-msvc @features
      - name: Stage backend binary
        shell: pwsh
        run: |
          # binaries/ 被 gitignore，CI checkout 后不存在，需先创建
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Move-Item -Force src-backend/qomicex-backend/target/aarch64-pc-windows-msvc/release/qomicex-backend.exe src-tauri/binaries/backend.exe
          # Packet.dll: ARM64 进程必须用 ARM64 版（x64 版加载失败 0xC0000135）
          Copy-Item -Force qomicex-connector-rust/easytier/third_party/arm64/Packet.dll src-tauri/binaries/Packet.dll
          # wintun.dll: easytier TUN 模式（管理员运行）动态加载，ARM64 版
          Copy-Item -Force qomicex-connector-rust/easytier/third_party/arm64/wintun.dll src-tauri/binaries/wintun.dll
          # 自更新器（Qomicex.Updater submodule）：include_bytes 嵌入主程序
          cargo build --release --manifest-path Qomicex.Updater/Cargo.toml --target aarch64-pc-windows-msvc
          Copy-Item -Force Qomicex.Updater/target/aarch64-pc-windows-msvc/release/qomicex-updater.exe src-tauri/binaries/updater.exe
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm exec tauri build --bundles nsis --target aarch64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        shell: pwsh
        run: |
          $version = "${{ needs.setup.outputs.displayVersion }}"
          Write-Output "=== Bundle dir contents ==="
          $bundleDir = "src-tauri/target/aarch64-pc-windows-msvc/release/bundle"
          Get-ChildItem -Recurse -Path $bundleDir | Select-Object FullName
          # createUpdaterArtifacts 产出 setup.exe.sig；从 sig 反推安装包名
          $sigFile = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.exe.sig" | Select-Object -First 1
          $platform = "windows-aarch64"
          if ($sigFile) {
            $exeName = $sigFile.Name -replace '\.sig$',''
            $signature = (Get-Content -Path $sigFile.FullName -Raw).Trim()
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$exeName"
            $fragment = @{ $platform = @{ url = $url; signature = $signature } }
          } else {
            Write-Warning "No .exe.sig found (TAURI_SIGNING_PRIVATE_KEY missing?); emitting unsigned fragment"
            $exe = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninst" } | Select-Object -First 1
            if (-not $exe) { throw "No installer found" }
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$($exe.Name)"
            $fragment = @{ $platform = @{ url = $url } }
          }
          $json = $fragment | ConvertTo-Json -Compress -Depth 10
          Set-Content -Path "update-fragment-$platform.json" -Value $json
          Write-Output "Fragment: $json"
      - name: Generate self-update package (windows-aarch64)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 走 step env 而非 run 体插值：workflow_dispatch 的版本输入会经
          # needs.setup.outputs.version 流到这里，run 体里的 ${{ }} 是文本拼接，
          # 构造的版本文本会在持有签名私钥的步骤里被执行。
          RELEASE_TAG: ${{ needs.setup.outputs.displayVersion }}
        run: |
          $setup = Get-ChildItem -Path "src-tauri/target/aarch64-pc-windows-msvc/release/bundle" -Recurse -Filter "*setup.exe" | Where-Object { $_.Name -notmatch "uninst" } | Select-Object -First 1
          if (-not $setup) { throw "No NSIS setup.exe found" }
          if (-not $setup) { throw "No NSIS setup.exe found" }
          $collect = Join-Path $env:RUNNER_TEMP "qomicex-install-collect"
          New-Item -ItemType Directory -Force $collect | Out-Null
          $log = Join-Path $env:RUNNER_TEMP "nsis-install.log"
          $p = Start-Process -FilePath $setup.FullName -ArgumentList "/S", "/D=$collect" -Wait -PassThru -RedirectStandardError $log
          if ($p.ExitCode -ne 0) { Get-Content $log; throw "NSIS silent install failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $collect "Qomicex Launcher.exe"))) { throw "NSIS silent install produced no launcher exe" }
          $pkg = "qomicex-update-windows-aarch64.zip"
          Compress-Archive -Path (Join-Path $collect '*') -DestinationPath $pkg -Force
          npx tauri signer sign $pkg
          Write-Output "self-update package: $pkg"
          # 自更新包索引条目：release 作业靠 update-package-fragment-*.json 合并
          # updates.json，缺这一步则该平台在索引里没有条目、自更新选不到包。
          $urlBase = "${{ github.server_url }}/${{ github.repository }}/releases/download/$env:RELEASE_TAG"
          $sig = (Get-Content -Path "$pkg.sig" -Raw).Trim()
          $fragment = @{ "windows-aarch64" = @{ url = "$urlBase/$pkg"; signature = $sig; strategy = "dir" } }
          $json = $fragment | ConvertTo-Json -Compress -Depth 10
          Set-Content -Path "update-package-fragment-windows-aarch64.json" -Value $json
          Write-Output "Fragment: $json"
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-windows-arm64
          path: |
            qomicex-update-*.zip
            qomicex-update-*.zip.sig
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-fragment-${{ github.job }}
          path: update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: qomicex-launcher-windows-arm64
          path: |

  release:
    if: success()
    permissions:
      contents: write
    needs:
      - setup
      - windows-x64
      - windows-arm64
      - linux-x64
      - linux-arm64
      - loongarch64
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate changelog
        run: |
          node scripts/generate-changelog.mjs \
            "${{ needs.setup.outputs.displayVersion }}" \
            "${{ needs.setup.outputs.releaseType }}" \
            RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          pattern: update-fragment-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: qomicex-launcher-*

      - name: Merge update fragments into latest.json
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          REQUIRED=${{ needs.setup.outputs.required }}
          NOTES_JSON=$(cat RELEASE_NOTES.md | jq -Rs '.')
          jq -n \
            --arg version "$VERSION" \
            --argjson required "$REQUIRED" \
            --argjson notes "$NOTES_JSON" \
            '{version: $version, required: $required, notes: $notes, pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: {}}' \
            > latest.json
          for f in update-fragment-*.json; do
            if [ -f "$f" ]; then
              KEY=$(jq -r 'keys[0]' "$f")
              VAL=$(jq '.[keys[0]]' "$f")
              jq --arg k "$KEY" --argjson v "$VAL" '.platforms[$k] = $v' latest.json > tmp.json
              mv tmp.json latest.json
            fi
          done
          echo "=== latest.json ==="
          cat latest.json

      - name: Generate alpha.json (alpha only)
        if: needs.setup.outputs.releaseType == 'alpha'
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          REQUIRED=${{ needs.setup.outputs.required }}
          NOTES_JSON=$(cat RELEASE_NOTES.md | jq -Rs '.')
          jq -n \
            --arg version "$VERSION" \
            --argjson required "$REQUIRED" \
            --argjson notes "$NOTES_JSON" \
            '{version: $version, required: $required, channel: "alpha", notes: $notes, pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: {}}' \
            > alpha.json
          for f in update-fragment-*.json; do
            if [ -f "$f" ]; then
              KEY=$(jq -r 'keys[0]' "$f")
              VAL=$(jq '.[keys[0]]' "$f")
              jq --arg k "$KEY" --argjson v "$VAL" '.platforms[$k] = $v' alpha.json > tmp.json
              mv tmp.json alpha.json
            fi
          done
          echo "=== alpha.json ==="
          cat alpha.json

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.displayVersion }}
          name: Qomicex Launcher ${{ needs.setup.outputs.displayVersion }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.setup.outputs.prerelease }}
          files: |
            latest.json
            alpha.json
            qomicex-launcher-*/**/*
          fail_on_unmatched_files: false

      - name: Trigger website rebuild
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}

  release-cnb:
    name: Publish release to CNB
    if: success()
    needs: [release, setup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CNB_REPO: ${{ vars.CNB_REPO }}
      CNB_HOST: cnb.cool
      CNB_USERNAME: cnb
      CNB_TOKEN: ${{ secrets.CNB_ACCESS_TOKEN }}
      CNB_UPLOAD_ASSETS: ${{ vars.CNB_UPLOAD_ASSETS || 'true' }}
    steps:
      - name: Install CNB CLI
        run: |
          npm install -g @cnbcool/cnb-cli
          export PATH="$PATH:$(npm prefix -g)/bin"
          cnb --version

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qomicex-launcher-*
          merge-multiple: true
          path: artifacts

      - name: Checkout (for tag resolution)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          else
            TAG="${{ needs.setup.outputs.displayVersion }}"
            PRERELEASE="${{ needs.setup.outputs.prerelease }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG (prerelease=$PRERELEASE)"

      - name: Generate release note
        run: |
          node scripts/generate-changelog.mjs \
            "${{ needs.setup.outputs.displayVersion }}" \
            "${{ needs.setup.outputs.releaseType }}" \
            RELEASE_NOTES.md

      - name: Push code + tag to CNB
        run: |
          set -e
          if [ -z "${{ env.CNB_REPO }}" ]; then
            echo "::error::CNB_REPO 未配置。请在仓库 Variables 中设置 CNB_REPO（形如 owner/repo）。"
            exit 1
          fi
          if [ -z "${{ secrets.CNB_ACCESS_TOKEN }}" ]; then
            echo "::error::CNB_ACCESS_TOKEN 未配置。请在仓库 Secrets 中添加 CNB_ACCESS_TOKEN。"
            exit 1
          fi
          git config --global safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE_URL="https://${CNB_USERNAME}:${CNB_TOKEN}@${CNB_HOST}/${CNB_REPO}.git"
          git remote remove cnb 2>/dev/null || true
          git remote add cnb "$REMOTE_URL"
          echo "==> Pushing main + tag ${{ steps.meta.outputs.tag }} to CNB ..."
          git push cnb main
          git push cnb "refs/tags/${{ steps.meta.outputs.tag }}"
          echo "==> Code + tag pushed to CNB."

      - name: Create CNB release
        run: |
          set -e
          ARGS=(--repo "${{ env.CNB_REPO }}" \
                --tag "${{ steps.meta.outputs.tag }}" \
                --name "Qomicex Launcher ${{ steps.meta.outputs.tag }}" \
                --body "$(cat RELEASE_NOTES.md)")
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          echo "==> Creating CNB release ..."
          cnb release create "${ARGS[@]}"

      - name: Upload release assets to CNB
        if: env.CNB_UPLOAD_ASSETS == 'true'
        run: |
          set -e
          cd artifacts
          for f in *; do
            [ -f "$f" ] || continue
            echo "==> Uploading asset: $f"
            cnb release asset-upload \
              --repo="${{ env.CNB_REPO }}" \
              --tag-name="${{ steps.meta.outputs.tag }}" \
              --file-name="$f"
          done

      - name: Report CNB publish status
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "============================================"
            echo "✅ 已发布到 CNB (Published to CNB)"
            echo "   目标仓库: ${CNB_HOST}/${CNB_REPO}"
            echo "   发布标签: ${{ steps.meta.outputs.tag }}"
            echo "   触发事件: ${{ github.event_name }}"
            echo "   同步时间: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "============================================"
          else
            echo "============================================"
            echo "❌ 发布到 CNB 失败 (CNB publish failed)"
            echo "   目标仓库: ${CNB_HOST}/${CNB_REPO}"
            echo "   请检查 CNB_REPO / CNB_ACCESS_TOKEN 配置及 CNB CLI 兼容性。"
            echo "============================================"
            exit 1
          fi

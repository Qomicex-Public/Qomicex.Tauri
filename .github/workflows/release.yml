            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
            echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
          else
            echo "::warning::No .AppImage.sig found; emitting unsigned fragment"
            BUNDLE=$(find "$BUNDLE_DIR" -name '*.AppImage' 2>/dev/null | head -1)
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.deb' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.rpm' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then echo "ERROR: No bundle found"; exit 1; fi
            ASSET_NAME=$(basename "$BUNDLE")
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
          fi
          cat "update-fragment-$PLATFORM.json"
      - name: Generate self-update packages (linux-x86_64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          URL_BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION"


          YY_THUNKS: ""
        run: |
          FEATURES=""
          if [ "${{ needs.setup.outputs.licenseRequired }}" = "true" ]; then FEATURES="--features license-required"; fi
          cargo build --release --manifest-path src-backend/qomicex-backend/Cargo.toml --target x86_64-unknown-linux-gnu $FEATURES

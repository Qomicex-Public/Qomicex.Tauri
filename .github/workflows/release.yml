  release:
    permissions:
      contents: write
    needs:
      - setup
      - quality-gate
      - windows-x64
      - windows-arm64
      - linux-x64
      - linux-arm64
      - macos-arm64
      - macos-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Generate changelog
        run: |
          node scripts/generate-changelog.mjs \
            "${{ needs.setup.outputs.displayVersion }}" \
            "${{ needs.setup.outputs.releaseType }}" \
            RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          pattern: update-fragment-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: qomicex-launcher-*

      - name: Merge update fragments into latest.json
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          REQUIRED=${{ needs.setup.outputs.required }}
          NOTES_JSON=$(cat RELEASE_NOTES.md | jq -Rs '.')
          jq -n \
            --arg version "$VERSION" \
            --argjson required "$REQUIRED" \
            --argjson notes "$NOTES_JSON" \
            '{version: $version, required: $required, notes: $notes, pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: {}}' \
            > latest.json
          for f in update-fragment-*.json; do
            if [ -f "$f" ]; then
              KEY=$(jq -r 'keys[0]' "$f")
              VAL=$(jq '.[keys[0]]' "$f")
              jq --arg k "$KEY" --argjson v "$VAL" '.platforms[$k] = $v' latest.json > tmp.json
              mv tmp.json latest.json
            fi
          done
          echo "=== latest.json ==="
          cat latest.json

      - name: Generate alpha.json (alpha only)
        if: needs.setup.outputs.releaseType == 'alpha'
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          REQUIRED=${{ needs.setup.outputs.required }}
          NOTES_JSON=$(cat RELEASE_NOTES.md | jq -Rs '.')
          jq -n \
            --arg version "$VERSION" \
            --argjson required "$REQUIRED" \
            --argjson notes "$NOTES_JSON" \
            '{version: $version, required: $required, channel: "alpha", notes: $notes, pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: {}}' \
            > alpha.json
          for f in update-fragment-*.json; do
            if [ -f "$f" ]; then
              KEY=$(jq -r 'keys[0]' "$f")
              VAL=$(jq '.[keys[0]]' "$f")
              jq --arg k "$KEY" --argjson v "$VAL" '.platforms[$k] = $v' alpha.json > tmp.json
              mv tmp.json alpha.json
            fi
          done
          echo "=== alpha.json ==="
          cat alpha.json

      # GitHub Release 不允许同名 asset：windows-x64 / windows-arm64 两个
      # artifact 都带 wintun.dll / Packet.dll（打进安装包的同时单独分发），
      # 重名会导致第二次上传走 update 路径并在 label restore 时 404
      # （softprops/action-gh-release 已知问题 #760）。上传前按架构重命名。
      - name: Rename arch-specific DLL assets
        run: |
          for d in qomicex-launcher-*; do
            case "$d" in
              *windows-x64) ARCH=x64 ;;
              *windows-arm64) ARCH=arm64 ;;
              *) continue ;;
            esac
            if [ -f "$d/wintun.dll" ]; then mv "$d/wintun.dll" "$d/wintun-$ARCH.dll"; fi
            if [ -f "$d/Packet.dll" ]; then mv "$d/Packet.dll" "$d/Packet-$ARCH.dll"; fi
            echo "renamed $d -> wintun-$ARCH.dll / Packet-$ARCH.dll"
          done

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.displayVersion }}
          name: Qomicex Launcher ${{ needs.setup.outputs.displayVersion }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.setup.outputs.prerelease }}
          files: |
            latest.json
            alpha.json
            qomicex-launcher-*/**/*
          fail_on_unmatched_files: false

      - name: Trigger website rebuild
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Sync releases

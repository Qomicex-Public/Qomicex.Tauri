name: Release

on:
  workflow_dispatch:
    inputs:
      major:
        description: '主版本号'
        required: true
        default: '0'
      minor:
        description: '次版本号'
        required: true
        default: '1'
      patch:
        description: '补丁版本号'
        required: true
        default: '0'
      releaseType:
        description: '发布类型'
        required: true
        type: choice
        options:
          - release
          - beta
          - alpha
      releaseNum:
        description: '发布序数（仅 release/beta，如 release5 的 5）'
        required: false
        default: '1'
      licenseRequired:
        description: '启用许可证验证'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '标记为 GitHub Pre-release'
        required: false
        default: false
        type: boolean
      required:
        description: '强制更新（用户必须更新才能继续使用）'
        required: false
        default: false
        type: boolean
      buildPlatform:
        description: '构建平台'
        required: true
        default: 'linux'
        type: choice
        options:
          - windows
          - linux
          - macos
          - loongarch64
          - all
      linuxBundles:
        description: 'Linux 打包格式（仅 linux/all 时有效）'
        required: false
        default: 'appimage,deb,rpm'
        type: choice
        options:
          - appimage,deb,rpm
          - appimage,deb
          - appimage,rpm
          - deb,rpm
          - appimage
          - deb
          - rpm
      macosArch:
        description: 'macOS 架构（仅 macos/all 时有效）'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - arm64
          - x64
      windowsArch:
        description: 'Windows 架构（仅 windows/all 时有效）'
        required: false
        default: 'x64'
        type: choice
        options:
          - both
          - arm64
          - x64
      linuxArch:
        description: 'Linux 架构（仅 linux/all 时有效）'
        required: false
        default: 'x64'
        type: choice
        options:
          - both
          - arm64
          - x64
  release:
    types: [published]

env:
  CARGO_TERM_COLORS: always
  GITHUB_SHA: ${{ github.sha }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.construct.outputs.version }}
      displayVersion: ${{ steps.construct.outputs.displayVersion }}
      releaseType: ${{ steps.construct.outputs.releaseType }}
      prerelease: ${{ steps.construct.outputs.prerelease }}
      licenseRequired: ${{ steps.construct.outputs.licenseRequired }}
      required: ${{ steps.construct.outputs.required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}

      - name: Construct version
        id: construct
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAG="${TAG#v}"
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "displayVersion=v$TAG" >> "$GITHUB_OUTPUT"
            TYPE=$(echo "$TAG" | sed -n 's/^[0-9.]*-\([a-z]*\)[0-9].*/\1/p')
            echo "releaseType=$TYPE" >> "$GITHUB_OUTPUT"
            echo "prerelease=${{ github.event.release.prerelease }}" >> "$GITHUB_OUTPUT"
            echo "licenseRequired=false" >> "$GITHUB_OUTPUT"
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            RTYPE="${{ github.event.inputs.releaseType }}"
            MAJOR="${{ github.event.inputs.major }}"
            MINOR="${{ github.event.inputs.minor }}"
            PATCH="${{ github.event.inputs.patch }}"
            RNUM="${{ github.event.inputs.releaseNum }}"

            if [ "$RTYPE" = "alpha" ]; then
              DATE=$(date +%Y%m%d)
              MAX_N=-1
              for TAG in $(git tag -l "v*-alpha${DATE}.*" 2>/dev/null); do
                N=$(echo "$TAG" | sed "s/.*alpha${DATE}\\.\\([0-9]*\\)/\\1/")
                if [ "$N" -gt "$MAX_N" ] 2>/dev/null; then MAX_N=$N; fi
              done
              BUILD=$((MAX_N + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}-alpha${DATE}.${BUILD}"
            else
              VERSION="${MAJOR}.${MINOR}.${PATCH}-${RTYPE}${RNUM}.0"
            fi

            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "displayVersion=v$VERSION" >> "$GITHUB_OUTPUT"
            echo "releaseType=$RTYPE" >> "$GITHUB_OUTPUT"

            PR="${{ github.event.inputs.prerelease }}"
            if [ "$RTYPE" = "release" ]; then
              echo "prerelease=${PR}" >> "$GITHUB_OUTPUT"
            else
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
            echo "licenseRequired=${{ github.event.inputs.licenseRequired }}" >> "$GITHUB_OUTPUT"
            echo "required=${{ github.event.inputs.required == 'true' && 'true' || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version files
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/bump-version.mjs "${{ steps.construct.outputs.version }}"

      - name: Show version
        run: |
          echo "Version: ${{ steps.construct.outputs.displayVersion }}"
          echo "Type: ${{ steps.construct.outputs.releaseType }}"
          echo "Prerelease: ${{ steps.construct.outputs.prerelease }}"
          echo "License: ${{ steps.construct.outputs.licenseRequired }}"
          echo "Required: ${{ steps.construct.outputs.required }}"

  windows-x64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'windows' || github.event.inputs.buildPlatform == 'all') &&
        (github.event.inputs.windowsArch == 'both' || github.event.inputs.windowsArch == 'x64'))
    needs: [setup]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
        shell: pwsh
      - name: Fetch LicenseCore.cs
        env:
          PAT: ${{ secrets.QOMICEX_PAT }}
        run: scripts/fetch-license-core.ps1 -licenseRequired "${{ needs.setup.outputs.licenseRequired }}" -pat "$env:PAT"
        shell: pwsh
      - run: dotnet publish src-backend/Qomicex.Launcher.Backend.Neo/Qomicex.Launcher.Backend.Neo.csproj -c Release -r win-x64 --self-contained true -p:DebugType=embedded -p:GitHash=${{ env.GITHUB_SHA }} -p:LicenseRequired=${{ needs.setup.outputs.licenseRequired }} -o src-tauri/binaries/tmp
        shell: pwsh
      - run: |
          Move-Item -Force src-tauri/binaries/tmp/Qomicex.Launcher.Backend.Neo.exe src-tauri/binaries/backend.exe
          Remove-Item -Recurse -Force src-tauri/binaries/tmp
        shell: pwsh
      - run: npm ci
      - run: npm run tauri -- build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        shell: pwsh
        run: |
          $version = "${{ needs.setup.outputs.displayVersion }}"
          Write-Output "=== Bundle dir contents ==="
          $bundleDir = "src-tauri/target/release/bundle"
          Get-ChildItem -Recurse -Path $bundleDir | Select-Object FullName
          $archive = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.nsis.zip" | Select-Object -First 1
          $platform = "windows-x86_64"
          if ($archive) {
            $sigFile = Get-ChildItem -Path $bundleDir -Recurse -Filter "$($archive.Name).sig" | Select-Object -First 1
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$($archive.Name)"
            if ($sigFile) {
              $signature = (Get-Content -Path $sigFile.FullName -Raw).Trim()
              $fragment = @{ $platform = @{ url = $url; signature = $signature } }
            } else {
              $fragment = @{ $platform = @{ url = $url } }
            }
          } else {
            $exe = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninst" } | Select-Object -First 1
            if (-not $exe) { throw "No installer found" }
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$($exe.Name)"
            $fragment = @{ $platform = @{ url = $url } }
          }
          $json = $fragment | ConvertTo-Json -Compress -Depth 10
          Set-Content -Path "update-fragment-$platform.json" -Value $json
          Write-Output "Fragment: $json"
      - uses: actions/upload-artifact@v4
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: qomicex-launcher-windows-x64
          path: src-tauri/target/release/bundle/**/*.exe

  windows-arm64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'windows' || github.event.inputs.buildPlatform == 'all') &&
        (github.event.inputs.windowsArch == 'both' || github.event.inputs.windowsArch == 'arm64'))
    needs: [setup]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-pc-windows-msvc }
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
        shell: pwsh
      - name: Fetch LicenseCore.cs
        env:
          PAT: ${{ secrets.QOMICEX_PAT }}
        run: scripts/fetch-license-core.ps1 -licenseRequired "${{ needs.setup.outputs.licenseRequired }}" -pat "$env:PAT"
        shell: pwsh
      - run: dotnet publish src-backend/Qomicex.Launcher.Backend.Neo/Qomicex.Launcher.Backend.Neo.csproj -c Release -r win-arm64 --self-contained true -p:DebugType=embedded -p:GitHash=${{ env.GITHUB_SHA }} -p:LicenseRequired=${{ needs.setup.outputs.licenseRequired }} -o src-tauri/binaries/tmp
        shell: pwsh
      - run: |
          Move-Item -Force src-tauri/binaries/tmp/Qomicex.Launcher.Backend.Neo.exe src-tauri/binaries/backend.exe
          Remove-Item -Recurse -Force src-tauri/binaries/tmp
        shell: pwsh
      - run: npm ci
      - run: npm run tauri -- build --bundles nsis --target aarch64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        shell: pwsh
        run: |
          $version = "${{ needs.setup.outputs.displayVersion }}"
          Write-Output "=== Bundle dir contents ==="
          $bundleDir = "src-tauri/target/aarch64-pc-windows-msvc/release/bundle"
          Get-ChildItem -Recurse -Path $bundleDir | Select-Object FullName
          $archive = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.nsis.zip" | Select-Object -First 1
          $platform = "windows-aarch64"
          if ($archive) {
            $sigFile = Get-ChildItem -Path $bundleDir -Recurse -Filter "$($archive.Name).sig" | Select-Object -First 1
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$($archive.Name)"
            if ($sigFile) {
              $signature = (Get-Content -Path $sigFile.FullName -Raw).Trim()
              $fragment = @{ $platform = @{ url = $url; signature = $signature } }
            } else {
              $fragment = @{ $platform = @{ url = $url } }
            }
          } else {
            $exe = Get-ChildItem -Path $bundleDir -Recurse -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninst" } | Select-Object -First 1
            if (-not $exe) { throw "No installer found" }
            $url = "${{ github.server_url }}/${{ github.repository }}/releases/download/$version/$($exe.Name)"
            $fragment = @{ $platform = @{ url = $url } }
          }
          $json = $fragment | ConvertTo-Json -Compress -Depth 10
          Set-Content -Path "update-fragment-$platform.json" -Value $json
          Write-Output "Fragment: $json"
      - uses: actions/upload-artifact@v4
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: qomicex-launcher-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**/*.exe

  linux-x64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'linux' || github.event.inputs.buildPlatform == 'all') &&
        (github.event.inputs.linuxArch == 'both' || github.event.inputs.linuxArch == 'x64'))
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-gnu }
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
      - name: Fetch LicenseCore.cs
        env:
          PAT: ${{ secrets.QOMICEX_PAT }}
        run: bash scripts/fetch-license-core.sh "${{ needs.setup.outputs.licenseRequired }}" "$PAT"
      - run: dotnet publish src-backend/Qomicex.Launcher.Backend.Neo/Qomicex.Launcher.Backend.Neo.csproj -c Release -r linux-x64 --self-contained true -p:DebugType=embedded -p:GitHash=${{ env.GITHUB_SHA }} -p:LicenseRequired=${{ needs.setup.outputs.licenseRequired }} -o src-tauri/binaries/tmp
      - run: |
          mv src-tauri/binaries/tmp/Qomicex.Launcher.Backend.Neo src-tauri/binaries/backend
          rm -rf src-tauri/binaries/tmp
      - run: npm ci
      - run: |
          BUNDLES="${{ github.event.inputs.linuxBundles }}"
          npm run tauri -- build --bundles "${BUNDLES:-appimage,deb,rpm}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "=== Bundle dir contents ==="
          find "$BUNDLE_DIR" -type f | head -30
          PLATFORM="linux-x86_64"
          ARCHIVE=$(find "$BUNDLE_DIR" -name "*.AppImage.tar.gz" 2>/dev/null | head -1)
          if [ -n "$ARCHIVE" ]; then
            ASSET_NAME=$(basename "$ARCHIVE")
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            SIG_FILE="${ARCHIVE}.sig"
            if [ -f "$SIG_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
              echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
            else
              echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
            fi
          else
            BUNDLE=$(find "$BUNDLE_DIR" -name '*.AppImage' 2>/dev/null | head -1)
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.deb' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.rpm' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then echo "ERROR: No bundle found"; exit 1; fi
            ASSET_NAME=$(basename "$BUNDLE")
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
          fi
          cat "update-fragment-$PLATFORM.json"
      - uses: actions/upload-artifact@v4
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: qomicex-launcher-linux-x64
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  linux-arm64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'linux' || github.event.inputs.buildPlatform == 'all') &&
        (github.event.inputs.linuxArch == 'both' || github.event.inputs.linuxArch == 'arm64'))
    needs: [setup]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-unknown-linux-gnu }
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm xdg-utils
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
      - name: Fetch LicenseCore.cs
        env:
          PAT: ${{ secrets.QOMICEX_PAT }}
        run: bash scripts/fetch-license-core.sh "${{ needs.setup.outputs.licenseRequired }}" "$PAT"
      - run: dotnet publish src-backend/Qomicex.Launcher.Backend.Neo/Qomicex.Launcher.Backend.Neo.csproj -c Release -r linux-arm64 --self-contained true -p:DebugType=embedded -p:GitHash=${{ env.GITHUB_SHA }} -p:LicenseRequired=${{ needs.setup.outputs.licenseRequired }} -o src-tauri/binaries/tmp
      - run: |
          mv src-tauri/binaries/tmp/Qomicex.Launcher.Backend.Neo src-tauri/binaries/backend
          rm -rf src-tauri/binaries/tmp
      - run: npm ci
      - run: |
          BUNDLES="${{ github.event.inputs.linuxBundles }}"
          npm run tauri -- build --bundles "${BUNDLES:-appimage,deb,rpm}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "=== Bundle dir contents ==="
          find "$BUNDLE_DIR" -type f | head -30
          PLATFORM="linux-aarch64"
          ARCHIVE=$(find "$BUNDLE_DIR" -name "*.AppImage.tar.gz" 2>/dev/null | head -1)
          if [ -n "$ARCHIVE" ]; then
            ASSET_NAME=$(basename "$ARCHIVE")
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            SIG_FILE="${ARCHIVE}.sig"
            if [ -f "$SIG_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
              echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
            else
              echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
            fi
          else
            BUNDLE=$(find "$BUNDLE_DIR" -name '*.AppImage' 2>/dev/null | head -1)
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.deb' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.rpm' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then echo "ERROR: No bundle found"; exit 1; fi
            ASSET_NAME=$(basename "$BUNDLE")
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
          fi
          cat "update-fragment-$PLATFORM.json"
      - uses: actions/upload-artifact@v4
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: qomicex-launcher-linux-arm64
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  loongarch64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'loongarch64' || github.event.inputs.buildPlatform == 'all'))
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: loongarch64

      - name: Build inside loongarch64 container
        id: build
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: loongarch64
          distro: ubuntu24.04
          github-token: ${{ github.token }}
          docker-run-args: |
            --env CARGO_TERM_COLORS=always
            --env GITHUB_SHA=${{ env.GITHUB_SHA }}
            --env TAURI_SIGNING_PRIVATE_KEY
            --env TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            --env QOMICEX_PAT=${{ secrets.QOMICEX_PAT }}
            --env VERSION=${{ needs.setup.outputs.version }}
            --env DISPLAY_VERSION=${{ needs.setup.outputs.displayVersion }}
            --env LICENSE_REQUIRED=${{ needs.setup.outputs.licenseRequired }}
          env: |
            CARGO_TERM_COLORS=always
            GITHUB_SHA=${{ env.GITHUB_SHA }}
            TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
            QOMICEX_PAT=${{ secrets.QOMICEX_PAT }}
            VERSION=${{ needs.setup.outputs.version }}
            DISPLAY_VERSION=${{ needs.setup.outputs.displayVersion }}
            LICENSE_REQUIRED=${{ needs.setup.outputs.licenseRequired }}
          install: |
            set -eux
            apt-get update
            apt-get install -y --no-install-recommends \
              curl wget ca-certificates gnupg lsb-release \
              build-essential clang llvm libclang-dev \
              libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
              patchelf rpm xdg-utils file pkg-config \
              libssl-dev libgtk-3-dev libsoup-3.0-dev \
              nodejs npm git
            # 安装 Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            . "$HOME/.cargo/env"
            rustup target add loongarch64-unknown-linux-gnu
            # 安装 .NET 10 (LoongArch64 社区 SDK)
            mkdir -p /usr/local/dotnet
            curl -sL "https://github.com/loongson/dotnet/releases/download/v10.0.109-loongarch64/dotnet-sdk-10.0.109-linux-loongarch64.tar.gz" \
              | tar xz -C /usr/local/dotnet
            ln -sf /usr/local/dotnet/dotnet /usr/local/bin/dotnet
            dotnet nuget add source -n lnuget.loongnix.cn --protocol-version 3 https://lnuget.loongnix.cn/v3/index.json
          run: |
            set -eux
            . "$HOME/.cargo/env"
            cd "$GITHUB_WORKSPACE"

            # Bump 版本号
            node scripts/bump-version.mjs "$VERSION"

            # 拉取 LicenseCore.cs
            bash scripts/fetch-license-core.sh "$LICENSE_REQUIRED" "$QOMICEX_PAT"

            # 发布 .NET 后端 (loongarch64 自包含)
            dotnet publish src-backend/Qomicex.Launcher.Backend.Neo/Qomicex.Launcher.Backend.Neo.csproj \
              -c Release -r linux-loongarch64 --self-contained true \
              -p:DebugType=embedded -p:GitHash=$GITHUB_SHA -p:LicenseRequired=$LICENSE_REQUIRED \
              -o src-tauri/binaries/tmp
            mv src-tauri/binaries/tmp/Qomicex.Launcher.Backend.Neo src-tauri/binaries/backend
            rm -rf src-tauri/binaries/tmp

            # 安装前端依赖并构建 Tauri
            npm ci
            BUNDLES="${{ github.event.inputs.linuxBundles }}"
            npm run tauri -- build --bundles "${BUNDLES:-appimage,deb,rpm}"

      - name: Generate update manifest fragment
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "=== Bundle dir contents ==="
          find "$BUNDLE_DIR" -type f | head -30
          PLATFORM="linux-loongarch64"
          ARCHIVE=$(find "$BUNDLE_DIR" -name "*.AppImage.tar.gz" 2>/dev/null | head -1)
          if [ -n "$ARCHIVE" ]; then
            ASSET_NAME=$(basename "$ARCHIVE")
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            SIG_FILE="${ARCHIVE}.sig"
            if [ -f "$SIG_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
              echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
            else
              echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
            fi
          else
            BUNDLE=$(find "$BUNDLE_DIR" -name '*.AppImage' 2>/dev/null | head -1)
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.deb' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$BUNDLE_DIR" -name '*.rpm' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then echo "ERROR: No bundle found"; exit 1; fi
            ASSET_NAME=$(basename "$BUNDLE")
            URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
            echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
          fi
          cat "update-fragment-$PLATFORM.json"

      - uses: actions/upload-artifact@v4
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json

      - uses: actions/upload-artifact@v4
        with:
          name: qomicex-launcher-linux-loongarch64
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm

  macos-arm64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'macos' || github.event.inputs.buildPlatform == 'all') &&
        (github.event.inputs.macosArch == 'both' || github.event.inputs.macosArch == 'arm64'))
    needs: [setup]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
      - name: Fetch LicenseCore.cs
        env:
          PAT: ${{ secrets.QOMICEX_PAT }}
        run: bash scripts/fetch-license-core.sh "${{ needs.setup.outputs.licenseRequired }}" "$PAT"
      - run: dotnet publish src-backend/Qomicex.Launcher.Backend.Neo/Qomicex.Launcher.Backend.Neo.csproj -c Release -r osx-arm64 --self-contained true -p:DebugType=embedded -p:GitHash=${{ env.GITHUB_SHA }} -p:LicenseRequired=${{ needs.setup.outputs.licenseRequired }} -o src-tauri/binaries/tmp
      - run: |
          mv src-tauri/binaries/tmp/Qomicex.Launcher.Backend.Neo src-tauri/binaries/backend
          rm -rf src-tauri/binaries/tmp
      - run: npm ci
      - run: npm run tauri -- build --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Create DMG
        run: |
          APP="src-tauri/target/release/bundle/macos/qomicex-launcher.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          STAGING=$(mktemp -d)
          mkdir -p "$DMG_DIR"
          codesign --force --deep --sign - "$APP"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Qomicex Launcher" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_DIR/qomicex-launcher_${{ needs.setup.outputs.displayVersion }}_$(uname -m).dmg"
          rm -rf "$STAGING"
      - name: Sign DMG for updater
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found to sign"
            exit 1
          fi
          npx tauri signer sign "$DMG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "=== Bundle dir contents ==="
          find "$BUNDLE_DIR" -type f | head -30
          DMG=$(find "$BUNDLE_DIR" -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "ERROR: No DMG found"; exit 1; fi
          ASSET_NAME=$(basename "$DMG")
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
          PLATFORM="darwin-aarch64"
          SIG_FILE="${DMG}.sig"
          if [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
            echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
          else
            echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
          fi
          cat "update-fragment-$PLATFORM.json"
      - uses: actions/upload-artifact@v4
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: qomicex-launcher-macos-arm64
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.dmg.sig


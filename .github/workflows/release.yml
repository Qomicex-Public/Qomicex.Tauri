    needs: [setup]
    runs-on: ubuntu-24.04
    # 交叉编译不模拟目标架构，正常应在原生作业量级内完成；设上限只用于
    # 拦截 sysroot 下载卡死或 cargo 挂起，避免拖住依赖它的 release。

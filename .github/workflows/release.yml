          # 路径一致），故 linuxBundles 只选 rpm 时从 rpm 负载解出同样布局，避免
          # RPM 安装用户拿不到自更新包。两种格式都没有时跳过而不报错，否则该
          # 合法选择会失败整个作业、连带丢掉已构建的 bundle 资产。

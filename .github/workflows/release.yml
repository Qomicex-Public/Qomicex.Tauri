      # loong64 源解包出 sysroot；源码级依赖用宿主 apt。
      - name: Install host build dependencies
        run: |
          sudo apt-get update
          # rpm：tauri build --bundles deb,rpm 需要 rpmbuild；宿主未装时会在
          # 打包阶段才失败，白跑一遍交叉编译。与其余平台保持一致。
          sudo apt-get install -y pkg-config protobuf-compiler libssl-dev libclang-dev \
            rpm xdg-utils patchelf
      - name: Fetch loong64 cross toolchain
        env:
          TOOLS_TAG: '20260912'
          # 该 release 的 immutable 为 false，固定 tag 挡不住资产被替换，
          # 而 xz -t 只验压缩流完整性、不验文件身份。这个编译器参与 tauri build，
          # 而该步骤持有 TAURI_SIGNING_PRIVATE_KEY，被替换的编译器可在链接期
          # 读走私钥。故把资产摘要钉在仓库里，解包前比对。
          EXPECTED_SHA256: 'f600fa153b09d1a64143af2c05a633e09b1bdb6dd760919437ee6b2901126329'
        run: |
          # 官方 loong64/cross-tools（loong64 组织维护）。
          # mainline 变体的 glibc 2.41 与 loong64 Debian trixie 的 libc6 2.41 一致
          # （stable 变体为 2.38，低于宿主系统库，链接期会缺符号）。
          URL="https://github.com/loong64/cross-tools/releases/download/${TOOLS_TAG}/x86_64-cross-tools-loongarch64-unknown-linux-gnu-mainline.tar.xz"
          TARBALL="$RUNNER_TEMP/cross-tools.tar.xz"
          # 整包重下，不用 -C - 续传：CI 实测续传拼出的文件让 dpkg-deb 报
          # lzma Broken pipe（半截旧数据接新数据导致偏移错乱）。
          rm -f "$TARBALL"
          curl -fL --retry 8 --retry-delay 3 --retry-all-errors \
            --speed-limit 1024 --speed-time 120 "$URL" -o "$TARBALL"
          # 先验身份（摘要），再验完整性（xz -t）。两者不可互相替代。
          ACTUAL=$(sha256sum "$TARBALL" | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED_SHA256" ]; then
            echo "工具链摘要不匹配，拒绝解包"
            echo "  期望: $EXPECTED_SHA256"
            echo "  实际: $ACTUAL"
            exit 1
          fi
          echo "工具链摘要校验通过: $ACTUAL"
          # 解包前先验魔数与完整性：只报「File format not recognized」看不出
          # 拿到的到底是截断包、错误页还是代理返回的 HTML。
          if ! xz -t "$TARBALL"; then
            echo "工具链包异常，实际大小 $(stat -c%s "$TARBALL") 字节，前 32 字节："
            head -c 32 "$TARBALL" | xxd || true
            exit 1
          fi
          # 用 -xf 而非 -xJ：-J 强制走 xz 过滤器，而 cross-tools 的 tarball 需要
          # tar 自动探测。实测同一文件 -xJ 报「无法识别文件格式」而 -xf 能解出。
          sudo mkdir -p /opt/x-tools
          sudo tar -xf "$TARBALL" -C /opt/x-tools
          /opt/x-tools/loongarch64-unknown-linux-gnu/bin/loongarch64-unknown-linux-gnu-gcc --version
      - name: Build loong64 sysroot
        env:
          TOOLS_DIR: /opt/x-tools
          SYSROOT: ${{ runner.temp }}/loong64-sysroot
        run: bash scripts/build-loong64-sysroot.sh
      - name: Export cross-compile environment
        run: |
          SYSROOT_DIR="${{ runner.temp }}/loong64-sysroot"
          # Rust 不读 LDFLAGS（那是 autotools 约定）：rustc 用
          # CARGO_TARGET_<TRIPLE>_LINKER 直接调 gcc，gcc 再调 ld。上一轮把
          # --sysroot 放进 LDFLAGS 因此完全没生效，链接仍报
          #   cannot find /lib/loongarch64-linux-gnu/libc.so.6
          # （glibc 的 libc.so 是 GNU ld script，内部引用绝对路径）。
          # 改为包一层 gcc：真实编译器前面拼 --sysroot，让 gcc 把 ld script 里
          # 的绝对路径重定位到 sysroot 内。只对链接生效，不影响头文件搜索
          # （头文件路径已由 C_INCLUDE_PATH / pkg-config 单独指定）。
          WRAP_DIR="$(mktemp -d)"
          REAL_CC="/opt/x-tools/loongarch64-unknown-linux-gnu/bin/loongarch64-unknown-linux-gnu-gcc"
          # 用 printf 而不是 heredoc：YAML 的 run: | 会给每行加缩进，
          # 而 heredoc 的结束标记必须顶格，两者冲突。
          printf '#!/bin/sh\nexec "%s" --sysroot="%s" "$@"\n' "$REAL_CC" "$SYSROOT_DIR" \
            > "$WRAP_DIR/loongarch64-unknown-linux-gnu-gcc"
          chmod +x "$WRAP_DIR/loongarch64-unknown-linux-gnu-gcc"
          echo "$WRAP_DIR" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_LINKER=loongarch64-unknown-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=$SYSROOT_DIR" >> "$GITHUB_ENV"
          # 与 build-loong64-sysroot.sh 的 PKGCONFIG_DIRS 保持完全一致：
          # 脚本按这三个目录校验 .pc 齐备，这里少一个就会出现「脚本校验通过、
          # cargo 阶段却找不到」的分裂。
          echo "PKG_CONFIG_LIBDIR=${{ runner.temp }}/loong64-sysroot/usr/lib/loongarch64-linux-gnu/pkgconfig:${{ runner.temp }}/loong64-sysroot/usr/share/pkgconfig:${{ runner.temp }}/loong64-sysroot/usr/lib/pkgconfig" >> "$GITHUB_ENV"
          # 清空 PKG_CONFIG_PATH：否则 pkg-config 会回落到宿主
          # /usr/lib/x86_64-linux-gnu/pkgconfig，把 amd64 库链进LoongArch 产物。
          echo "PKG_CONFIG_PATH=" >> "$GITHUB_ENV"
          echo "/opt/x-tools/loongarch64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
          # Debian multiarch 下部分架构相关头只在 usr/include/<triple>/ 子目录，
          # 而 pkg-config 只发 -I$sysroot/usr/include；缺这层 openssl-sys 等会失败。
          # 注意用 Debian multiarch 元组（loongarch64-linux-gnu），不是 Rust/工具链
          # 三元组（loongarch64-unknown-linux-gnu）——后者在该目录下不存在，
          # sysroot 脚本末尾也按前者断言。
          echo "C_INCLUDE_PATH=$SYSROOT_DIR/usr/include/loongarch64-linux-gnu" >> "$GITHUB_ENV"
          # 补 glibc 传统布局目录，并放行共享库的未解析符号。
          #
          # 用 CARGO_TARGET_<TRIPLE>_RUSTFLAGS 而不是全局 RUSTFLAGS：后者会连
          # 宿主侧的 build script 一起影响，把 loong64 的库目录塞进宿主链接。
          # target 级变量会覆盖 config.toml 的 [build].rustflags，故
          # reqwest_unstable 必须一并带上。
          #
          # --allow-shlib-undefined：sysroot 里的 libwebkit2gtk-4.1.so、
          # libgdk-3.so 自身对 gstreamer / X11 / sqlite3 有未解析符号。这些是
          # 它们的**运行时**依赖（在 .pc 的 Requires.private 里，pkg-config 的
          # --libs 默认不展开），目标机上由发行版的对应 .so 提供。产物是动态
          # 链接的可执行文件，这些符号本就该留给运行时，不该在链接期强制解析。
          # 不加这个参数会报 2000+ 个 undefined reference。
          echo "CARGO_TARGET_LOONGARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS=--cfg reqwest_unstable -C link-arg=-Wl,--allow-shlib-undefined -L $SYSROOT_DIR/lib64 -L $SYSROOT_DIR/usr/lib64 -L $SYSROOT_DIR/usr/lib/loongarch64-linux-gnu -L $SYSROOT_DIR/lib/loongarch64-linux-gnu" >> "$GITHUB_ENV"
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Build Rust backend
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          FEATURES=""
          if [ "${{ needs.setup.outputs.licenseRequired }}" = "true" ]; then FEATURES="--features license-required"; fi
          # protoc 产出的是与目标架构无关的描述符，用宿主 x86_64 的即可
          cargo build --release --manifest-path src-backend/qomicex-backend/Cargo.toml \
            --target loongarch64-unknown-linux-gnu $FEATURES
      - name: Stage backend binary
        run: |
          # binaries/ 被 gitignore，CI checkout 后不存在，需先创建
          mkdir -p src-tauri/binaries
          mv src-backend/qomicex-backend/target/loongarch64-unknown-linux-gnu/release/qomicex-backend src-tauri/binaries/backend
          # 自更新器（Qomicex.Updater submodule）：include_bytes 嵌入主程序
          cargo build --release --manifest-path Qomicex.Updater/Cargo.toml \
            --target loongarch64-unknown-linux-gnu
          cp Qomicex.Updater/target/loongarch64-unknown-linux-gnu/release/qomicex-updater src-tauri/binaries/updater
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      # tauri-bundler 的 Settings::binary_arch 用硬编码 triple 前缀匹配架构，
      # 白名单只有 x86_64/i*/arm*/aarch64/riscv64/universal，LoongArch 会直接
      # panic!("Unexpected target triple")。故这里只编译、不打包（--no-bundle），
      # 由 scripts/package-loong64.sh 按 Tauri 官方 deb/rpm 布局自行组包。
      - name: Build application (compile only)
        run: pnpm exec tauri build --no-bundle --target loongarch64-unknown-linux-gnu
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Package deb/rpm (loongarch64)
        run: |
          VERSION="${{ needs.setup.outputs.version }}" \
          OUT_DIR="$PWD/dist-loong64" \
          bash scripts/package-loong64.sh
      # 交叉编译静默出错时，产物会是 amd64 ELF 却挂loong64 的 deb 名。
      # 这里显式断言架构，避免错误产物流到 release。
      - name: Assert loongarch64 artifacts
        run: |
          set -euo pipefail
          OUT_DIR="$PWD/dist-loong64"
          DEB=$(find "$OUT_DIR" -name '*.deb' | head -1)
          [ -n "$DEB" ] || { echo "ERROR: 未找到 deb 产物"; exit 1; }

          # 包元数据的架构字段必须是龙芯约定值，否则安装在龙芯机器上会被拒绝。
          ARCH_FIELD=$(ar p "$DEB" control.tar.gz | tar -xzO ./control | sed -n 's/^Architecture: //p')
          [ "$ARCH_FIELD" = "loong64" ] \
            || { echo "ERROR: deb Architecture 应为 loong64，实际: '$ARCH_FIELD'"; exit 1; }

          # 交叉编译静默出错时，产物可能是宿主 amd64 ELF 却挂着 loong64 的包名，
          # 故从包内直接取二进制断言架构。
          ELF_ARCH=$(ar p "$DEB" data.tar.gz | tar -xzO ./usr/bin/qomicex-launcher \
            | head -c 20 | od -An -tx1 | tr -d ' \n')
          # LoongArch 为小端序，e_machine = 0x0102（258）在偏移 18-19 字节存为
          # 02 01，十六进制串因此以 0201 结尾（按大端写成 0102 永远匹配不上）。
          case "$ELF_ARCH" in
            *0201) echo "deb 内二进制架构校验通过: LoongArch (e_machine=0x0102)" ;;
            *) echo "ERROR: deb 内二进制不是 LoongArch，ELF 头前 20 字节: $ELF_ARCH"; exit 1 ;;
          esac

          # 交叉链接最危险的失败模式是把宿主 amd64 的 .so 链进来，逐个确认关键库。
          for so in libwebkit2gtk-4.1.so.0 libgtk-3.so.0 libsoup-3.0.so.0; do
            hit=$(find "$PKG_CONFIG_SYSROOT_DIR" -name "${so}*" -type f | head -1)
            [ -n "$hit" ] || { echo "ERROR: sysroot 缺少 $so"; exit 1; }
            readelf -h "$hit" | grep -q 'Machine:.*LoongArch' \
              || { echo "ERROR: $so 不是 LoongArch: $hit"; exit 1; }
          done
          echo "产物与运行时依赖架构校验通过: LoongArch"
      - name: Generate update manifest fragment
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 走 step env 而非 run 体插值：displayVersion 源自 workflow_dispatch 的
          # 版本输入，run 体里的 ${{ }} 是文本拼接，构造的版本文本会在持有签名
          # 私钥的步骤里被 shell 执行。
          VERSION: ${{ needs.setup.outputs.displayVersion }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          OUT_DIR="$PWD/dist-loong64"
          echo "=== dist-loong64 contents ==="
          find "$OUT_DIR" -type f | head -30
          PLATFORM="linux-loongarch64"
          ARCHIVE=$(find "$OUT_DIR" -name "*.AppImage.tar.gz" 2>/dev/null | head -1)
          if [ -n "$ARCHIVE" ]; then
            ASSET_NAME=$(basename "$ARCHIVE")
            URL="$SERVER/$REPO/releases/download/$VERSION/$ASSET_NAME"
            SIG_FILE="${ARCHIVE}.sig"
            if [ -f "$SIG_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
              echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
            else
              echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
            fi
          else
            BUNDLE=$(find "$OUT_DIR" -name '*.AppImage' 2>/dev/null | head -1)
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$OUT_DIR" -name '*.deb' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then BUNDLE=$(find "$OUT_DIR" -name '*.rpm' 2>/dev/null | head -1); fi
            if [ -z "$BUNDLE" ]; then echo "ERROR: No bundle found"; exit 1; fi
            ASSET_NAME=$(basename "$BUNDLE")
            URL="$SERVER/$REPO/releases/download/$VERSION/$ASSET_NAME"
            # loong64 无 linuxdeploy 支持，不出 AppImage → 走 deb/rpm，没有 .sig。
            # Tauri 清单要求每个条目都有签名，后端 update.rs 会把 signature 为空的
            # 条目整体 retain 掉，于是 loong64 客户端永远查不到更新。这里用与
            # 自更新包同一把 minisign 私钥对 deb 本体签名，让条目带有效签名。
            #
            # 用仓库锁定的 CLI（pnpm exec，版本由 lockfile 决定），不用 npx 现装：
            # 本步骤持有签名私钥，从 registry 拉未锁定版本等于把私钥交给未 review 的代码。
            SIG_FILE="${BUNDLE}.sig"
            if [ ! -f "$SIG_FILE" ]; then
              # 不能让它中止本步骤：签名失败时应走下面的无签名回退分支，
              # 否则后续 upload-artifact 全部跳过、作业判 failure，整个发布被拖下水。
              pnpm exec tauri signer sign "$BUNDLE" \
                || echo "::warning::pnpm exec tauri signer sign 失败，将写无签名条目"
            fi
            if [ -f "$SIG_FILE" ]; then
              SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
              echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
            else
              echo "::warning::loong64 无法为 $ASSET_NAME 生成签名，该条目会被后端丢弃"
              echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
            fi
          fi
          cat "update-fragment-$PLATFORM.json"
      - name: Generate self-update package (linux-loongarch64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 走 step env 而非 run 体插值：workflow_dispatch 的版本输入会经
          # needs.setup.outputs.version 流到这里，run 体里的 ${{ }} 是文本拼接，
          # 构造的版本文本会在持有签名私钥的步骤里被执行。
          RELEASE_TAG: ${{ needs.setup.outputs.displayVersion }}
        run: |
          OUT_DIR="$PWD/dist-loong64"
          # 下载 URL 必须用带 v 前缀的 displayVersion：release 作业按
          # needs.setup.outputs.displayVersion 建 tag，用不带 v 的 version 会 404。
          URL_BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$RELEASE_TAG"

          # loong64 无 linuxdeploy 支持，产物固定 deb,rpm → 不出 appimage 包。
          # system 包以 deb 布局为基线：解出 / 相对布局后整体 zip。
          # 用 ar + tar 而非 dpkg-deb：与 build-loong64-sysroot.sh 一致，避开
          # dpkg-deb 在部分包上的解压管道问题。
          DEB=$(find "$OUT_DIR" -name '*.deb' | head -1)
          if [ -z "$DEB" ]; then echo "ERROR: No deb found"; exit 1; fi
          STAGING=$(mktemp -d)
          ar p "$DEB" data.tar.gz | tar -xz -C "$STAGING"
          PKG_SYS="qomicex-update-linux-loongarch64-system.zip"
          rm -f "$PKG_SYS" "$PKG_SYS.sig"
          (cd "$STAGING" && zip -qr "$OLDPWD/$PKG_SYS" .)
          # 用仓库锁定的 CLI 签名（pnpm exec），不用 npx 现装：本步骤持有签名私钥。
          pnpm exec tauri signer sign "$PWD/$PKG_SYS"
          rm -rf "$STAGING"
          echo "{\"linux-loongarch64-system\":{\"url\":\"$URL_BASE/$PKG_SYS\",\"signature\":\"$(tr -d '\n' < "$PKG_SYS.sig")\",\"strategy\":\"system\"}}" > "update-package-fragment-linux-loongarch64-system.json"
          cat update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-linux-loongarch64
          path: |
            qomicex-update-*.zip
            qomicex-update-*.zip.sig
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-fragment-${{ github.job }}
          path: update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: qomicex-launcher-linux-loongarch64
          path: |
            dist-loong64/*.deb
            dist-loong64/*.rpm
            dist-loong64/*.sig

  macos-arm64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'macos' || github.event.inputs.buildPlatform == 'all' ||
         github.event.inputs.buildPlatform == 'all+loongarch64') &&
        (github.event.inputs.macosArch == 'both' || github.event.inputs.macosArch == 'arm64'))
    # 与 quality-gate 并行：release 汇总时仍要求 gate 通过，坏产物不会发布
    needs: [setup]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-apple-darwin }
      - uses: swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with: { node-version: '22', cache: pnpm }
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Build Rust backend
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          FEATURES=""
          if [ "${{ needs.setup.outputs.licenseRequired }}" = "true" ]; then FEATURES="--features license-required"; fi
          cargo build --release --manifest-path src-backend/qomicex-backend/Cargo.toml --target aarch64-apple-darwin $FEATURES
      - name: Stage backend binary
        run: |
          # binaries/ 被 gitignore，CI checkout 后不存在，需先创建
          mkdir -p src-tauri/binaries
          mv src-backend/qomicex-backend/target/aarch64-apple-darwin/release/qomicex-backend src-tauri/binaries/backend
          # 自更新器（Qomicex.Updater submodule）：include_bytes 嵌入主程序
          cargo build --release --manifest-path Qomicex.Updater/Cargo.toml --target aarch64-apple-darwin
          cp Qomicex.Updater/target/aarch64-apple-darwin/release/qomicex-updater src-tauri/binaries/updater
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm exec tauri build --bundles app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Free disk space before DMG
        run: |
          rm -rf src-tauri/target/release/incremental \
                 src-tauri/target/release/build \
                 src-tauri/target/release/.fingerprint \
                 src-tauri/target/release/deps
          pnpm store prune || true
          df -h
      - name: Create DMG
        run: |
          APP="src-tauri/target/release/bundle/macos/Qomicex Launcher.app"
          DMG_DIR="src-tauri/target/release/bundle/dmg"
          STAGING=$(mktemp -d)
          mkdir -p "$DMG_DIR"
          codesign --force --deep --sign - "$APP"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          SIZE_MB=$(du -sm "$STAGING" | awk '{printf "%.0f", $1 * 1.3 + 64}')
          hdiutil create -volname "Qomicex Launcher" \
            -size "${SIZE_MB}m" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_DIR/qomicex-launcher_${{ needs.setup.outputs.displayVersion }}_$(uname -m).dmg"
          rm -rf "$STAGING"
      - name: Sign DMG for updater
        run: |
          DMG=$(find src-tauri/target/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found to sign"
            exit 1
          fi
          npx tauri signer sign "$DMG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate self-update package (darwin-aarch64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          URL_BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION"
          # app 包：zip 内放 .app 内部内容（Contents/...），updater 解压覆盖 bundle 根
          APP="$BUNDLE_DIR/macos/Qomicex Launcher.app"
          PKG="qomicex-update-darwin-aarch64.zip"
          (cd "$APP" && zip -qry "$OLDPWD/$PKG" .)
          npx tauri signer sign "$PKG"
          echo "{\"darwin-aarch64\":{\"url\":\"$URL_BASE/$PKG\",\"signature\":\"$(tr -d '\n' < "$PKG.sig")\",\"strategy\":\"app\"}}" > "update-package-fragment-darwin-aarch64.json"
          cat update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-macos-arm64
          path: |
            qomicex-update-*.zip
            qomicex-update-*.zip.sig
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-fragment-${{ github.job }}
          path: update-package-fragment-*.json
      - name: Generate update manifest fragment
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "=== Bundle dir contents ==="
          find "$BUNDLE_DIR" -type f | head -30
          DMG=$(find "$BUNDLE_DIR" -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "ERROR: No DMG found"; exit 1; fi
          ASSET_NAME=$(basename "$DMG")
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
          PLATFORM="darwin-aarch64"
          SIG_FILE="${DMG}.sig"
          if [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
            echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
          else
            echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
          fi
          cat "update-fragment-$PLATFORM.json"
      - uses: actions/upload-artifact@v7
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: qomicex-launcher-macos-arm64
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.dmg.sig

  macos-x64:
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.buildPlatform == 'macos' || github.event.inputs.buildPlatform == 'all' ||
         github.event.inputs.buildPlatform == 'all+loongarch64') &&
        (github.event.inputs.macosArch == 'both' || github.event.inputs.macosArch == 'x64'))
    # 与 quality-gate 并行：release 汇总时仍要求 gate 通过，坏产物不会发布
    needs: [setup]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-apple-darwin }
      # 同 windows-arm64：rust-toolchain.toml 钉住 1.95.0，交叉 target 必须装进被钉住的链
      - name: Install cross target for pinned toolchain
        run: rustup target add x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with: { node-version: '22', cache: pnpm }
      - run: node scripts/bump-version.mjs "${{ needs.setup.outputs.version }}"
      - name: Setup connector build
        id: connector
        uses: ./.github/actions/setup-connector-build
        with:
          pat: ${{ secrets.QOMICEX_PAT }}
      - name: Build Rust backend
        env:
          PROTOC: ${{ steps.connector.outputs.protoc-path }}
          VC_LTL: ""
          YY_THUNKS: ""
        run: |
          FEATURES=""
          if [ "${{ needs.setup.outputs.licenseRequired }}" = "true" ]; then FEATURES="--features license-required"; fi
          cargo build --release --manifest-path src-backend/qomicex-backend/Cargo.toml --target x86_64-apple-darwin $FEATURES
      - name: Stage backend binary
        run: |
          # binaries/ 被 gitignore，CI checkout 后不存在，需先创建
          mkdir -p src-tauri/binaries
          mv src-backend/qomicex-backend/target/x86_64-apple-darwin/release/qomicex-backend src-tauri/binaries/backend
          # 自更新器（Qomicex.Updater submodule）：include_bytes 嵌入主程序
          cargo build --release --manifest-path Qomicex.Updater/Cargo.toml --target x86_64-apple-darwin
          cp Qomicex.Updater/target/x86_64-apple-darwin/release/qomicex-updater src-tauri/binaries/updater
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qomicex/plugin-ui build
      - run: pnpm exec tauri build --bundles app --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Free disk space before DMG
        run: |
          rm -rf src-tauri/target/x86_64-apple-darwin/release/incremental \
                 src-tauri/target/x86_64-apple-darwin/release/build \
                 src-tauri/target/x86_64-apple-darwin/release/.fingerprint \
                 src-tauri/target/x86_64-apple-darwin/release/deps
          pnpm store prune || true
          df -h
      - name: Create DMG
        run: |
          APP="src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Qomicex Launcher.app"
          DMG_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle/dmg"
          STAGING=$(mktemp -d)
          mkdir -p "$DMG_DIR"
          codesign --force --deep --sign - "$APP"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          SIZE_MB=$(du -sm "$STAGING" | awk '{printf "%.0f", $1 * 1.3 + 64}')
          hdiutil create -volname "Qomicex Launcher" \
            -size "${SIZE_MB}m" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_DIR/qomicex-launcher_${{ needs.setup.outputs.displayVersion }}_x86_64.dmg"
          rm -rf "$STAGING"
      - name: Sign DMG for updater
        run: |
          DMG=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No DMG found to sign"
            exit 1
          fi
          npx tauri signer sign "$DMG"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Generate update manifest fragment
        run: |
          VERSION="${{ needs.setup.outputs.displayVersion }}"
          BUNDLE_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle"
          echo "=== Bundle dir contents ==="
          find "$BUNDLE_DIR" -type f | head -30
          DMG=$(find "$BUNDLE_DIR" -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then echo "ERROR: No DMG found"; exit 1; fi
          ASSET_NAME=$(basename "$DMG")
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$ASSET_NAME"
          PLATFORM="darwin-x86_64"
          SIG_FILE="${DMG}.sig"
          if [ -f "$SIG_FILE" ]; then
            SIGNATURE=$(cat "$SIG_FILE" | tr -d '\n')
            echo "{\"$PLATFORM\":{\"url\":\"$URL\",\"signature\":\"$SIGNATURE\"}}" > "update-fragment-$PLATFORM.json"
          else
            echo "{\"$PLATFORM\":{\"url\":\"$URL\"}}" > "update-fragment-$PLATFORM.json"
          fi
          cat "update-fragment-$PLATFORM.json"
      - name: Generate self-update package (darwin-x86_64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          BUNDLE_DIR="src-tauri/target/x86_64-apple-darwin/release/bundle"
          URL_BASE="${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION"
          APP="$BUNDLE_DIR/macos/Qomicex Launcher.app"
          PKG="qomicex-update-darwin-x86_64.zip"
          (cd "$APP" && zip -qry "$OLDPWD/$PKG" .)
          npx tauri signer sign "$PKG"
          echo "{\"darwin-x86_64\":{\"url\":\"$URL_BASE/$PKG\",\"signature\":\"$(tr -d '\n' < "$PKG.sig")\",\"strategy\":\"app\"}}" > "update-package-fragment-darwin-x86_64.json"
          cat update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-macos-x64
          path: |
            qomicex-update-*.zip
            qomicex-update-*.zip.sig
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-fragment-${{ github.job }}
          path: update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: qomicex-launcher-macos-x64
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/**/*.dmg.sig

  release:
    permissions:
      contents: write
    needs:
      - setup
      - quality-gate
      - windows-x64
      - windows-arm64
      - linux-x64
      - linux-arm64
      - macos-arm64
      - macos-x64
      - loongarch64
    # 显式写状态函数，不用默认的隐式 success() 门禁：
    # 默认语义下 needs 里任一作业 skipped/failure 都会连带本作业 skipped，
    # 于是单独 dispatch 一个平台（其余平台 skipped）时永远发不了版。
    #
    # 逐平台判 success||skipped 让「只构建部分平台」可行，但必须再要求
    # 至少有一个构建作业真正成功：否则非法输入或全部构建失败时，这里会
    # 放行一个 platforms 为空、不含任何启动器资产的空发布。
    #
    # loongarch64 是可选平台：无论它 success、failure 还是 skipped，都不影响
    # 发布决策（故不在下面的条件里出现）。它已在 needs 中，release 会等它结束，
    # 因此不存在「片段未上传就先合并清单」的竞态；失败时只是本次缺 loong64 产物，
    # 由首个步骤打 warning 提示。
    if: |
      !cancelled() &&
      needs.setup.result == 'success' &&
      needs.quality-gate.result == 'success' &&
      (needs.windows-x64.result == 'success' || needs.windows-x64.result == 'skipped') &&
      (needs.windows-arm64.result == 'success' || needs.windows-arm64.result == 'skipped') &&
      (needs.linux-x64.result == 'success' || needs.linux-x64.result == 'skipped') &&
      (needs.linux-arm64.result == 'success' || needs.linux-arm64.result == 'skipped') &&
      (needs.macos-arm64.result == 'success' || needs.macos-arm64.result == 'skipped') &&
      (needs.macos-x64.result == 'success' || needs.macos-x64.result == 'skipped') &&
      (needs.windows-x64.result == 'success' ||
       needs.windows-arm64.result == 'success' ||
       needs.linux-x64.result == 'success' ||
       needs.linux-arm64.result == 'success' ||
       needs.macos-arm64.result == 'success' ||
       needs.macos-x64.result == 'success' ||
       needs.loongarch64.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Warn when loongarch64 did not ship
        if: needs.loongarch64.result != 'success'
        run: |
          echo "::warning::loongarch64 本次未产出（${{ needs.loongarch64.result }}），发布不含 loong64 产物"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Generate changelog
        run: |
          node scripts/generate-changelog.mjs \
            "${{ needs.setup.outputs.displayVersion }}" \
            "${{ needs.setup.outputs.releaseType }}" \
            RELEASE_NOTES.md

      - uses: actions/download-artifact@v4
        with:
          pattern: update-fragment-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: update-package-fragment-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: update-package-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: qomicex-launcher-*

      # 分次 dispatch 同一版本时，本次只产出一部分平台的 fragment。若直接用它
      # 从零重建清单，先前已发布平台的条目会被整体抹掉（action-gh-release 默认
      # 覆盖同名资产）。故先把已发布版本的清单取下来作为基线。
      # 取不到（首次发布 / 该 tag 尚无资产）时留空，后续逻辑退化为从零构建。
      - name: Fetch existing manifests for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.displayVersion }}
        run: |
          mkdir -p existing
          for name in latest.json updates.json alpha.json; do
            if gh release download "$TAG" --pattern "$name" --dir existing --clobber 2>/dev/null; then
              echo "已取得现有 $name"
            else
              echo "无现有 $name（首次发布或该 tag 尚无此资产）"
            fi
          done
          ls -la existing || true

      - name: Merge update fragments into latest.json
        run: |
          # manifest.version 必须是合法 semver（Tauri updater 用它跟安装版 current_version 比较，
          # `v` 前缀会令 semver 解析失败 → check() 无声返回“无更新”）。用不带 `v` 的 version；
          # 下载 URL 仍用 displayVersion（release tag 带 `v`，见平台 fragment 生成处）。
          VERSION="${{ needs.setup.outputs.version }}"
          REQUIRED=${{ needs.setup.outputs.required }}
          NOTES_JSON=$(cat RELEASE_NOTES.md | jq -Rs '.')
          # 以现有清单的 platforms 为基线，保留本次未重建平台的条目。
          BASE='{}'
          if [ -f existing/latest.json ]; then
            BASE=$(jq -c '.platforms // {}' existing/latest.json)
            echo "继承现有平台条目: $(jq -r 'keys | join(", ")' <<< "$BASE")"
          fi
          jq -n \
            --arg version "$VERSION" \
            --argjson required "$REQUIRED" \
            --argjson notes "$NOTES_JSON" \
            --argjson base "$BASE" \
            '{version: $version, required: $required, notes: $notes, pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: $base}' \
            > latest.json
          for f in update-fragment-*.json; do
            if [ -f "$f" ]; then
              KEY=$(jq -r 'keys[0]' "$f")
              VAL=$(jq '.[keys[0]]' "$f")
              jq --arg k "$KEY" --argjson v "$VAL" '.platforms[$k] = $v' latest.json > tmp.json
              mv tmp.json latest.json
            fi
          done
          # GitHub 上传 asset 时把文件名里的空格替换为 '.'，fragment 用的是本地
          # bundle 名（含空格），必须归一化成与实际 asset 名一致，否则 404。
          jq '.platforms |= map_values(.url |= gsub(" "; "."))' latest.json > tmp.json && mv tmp.json latest.json
          echo "=== latest.json ==="
          cat latest.json

      - name: Merge update-package fragments into updates.json
        run: |
          # 自更新链路（Qomicex.Updater）的更新计划：platforms key 即包名后缀
          # （windows-x86_64 / linux-x86_64-appimage / linux-x86_64-system /
          # darwin-aarch64 ...），条目含 url + signature + strategy。
          VERSION="${{ needs.setup.outputs.version }}"
          REQUIRED=${{ needs.setup.outputs.required }}
          NOTES_JSON=$(cat RELEASE_NOTES.md | jq -Rs '.')
          BASE='{}'
          if [ -f existing/updates.json ]; then
            BASE=$(jq -c '.platforms // {}' existing/updates.json)
            echo "继承现有平台条目: $(jq -r 'keys | join(", ")' <<< "$BASE")"
          fi
          jq -n \
            --arg version "$VERSION" \
            --argjson required "$REQUIRED" \
            --argjson notes "$NOTES_JSON" \
            --argjson base "$BASE" \
            '{version: $version, required: $required, notes: $notes, pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: $base}' \
            > updates.json
          for f in update-package-fragment-*.json; do
            if [ -f "$f" ]; then
              KEY=$(jq -r 'keys[0]' "$f")
              VAL=$(jq '.[keys[0]]' "$f")
              jq --arg k "$KEY" --argjson v "$VAL" '.platforms[$k] = $v' updates.json > tmp.json
              mv tmp.json updates.json
            fi
          done
          echo "=== updates.json ==="
          cat updates.json

      - name: Generate alpha.json (alpha only)
        if: needs.setup.outputs.releaseType == 'alpha'
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          REQUIRED=${{ needs.setup.outputs.required }}
          NOTES_JSON=$(cat RELEASE_NOTES.md | jq -Rs '.')
          BASE='{}'
          if [ -f existing/alpha.json ]; then
            BASE=$(jq -c '.platforms // {}' existing/alpha.json)
            echo "继承现有平台条目: $(jq -r 'keys | join(", ")' <<< "$BASE")"
          fi
          jq -n \
            --arg version "$VERSION" \
            --argjson required "$REQUIRED" \
            --argjson notes "$NOTES_JSON" \
            --argjson base "$BASE" \
            '{version: $version, required: $required, channel: "alpha", notes: $notes, pub_date: (now | strftime("%Y-%m-%dT%H:%M:%SZ")), platforms: $base}' \
            > alpha.json
          for f in update-fragment-*.json; do
            if [ -f "$f" ]; then
              KEY=$(jq -r 'keys[0]' "$f")
              VAL=$(jq '.[keys[0]]' "$f")
              jq --arg k "$KEY" --argjson v "$VAL" '.platforms[$k] = $v' alpha.json > tmp.json
              mv tmp.json alpha.json
            fi
          done
          # 同 latest.json：asset 名空格 → '.'，与 GitHub 实际文件名对齐
          jq '.platforms |= map_values(.url |= gsub(" "; "."))' alpha.json > tmp.json && mv tmp.json alpha.json
          echo "=== alpha.json ==="
          cat alpha.json

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.displayVersion }}
          name: Qomicex Launcher ${{ needs.setup.outputs.displayVersion }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ needs.setup.outputs.prerelease }}
          files: |
            latest.json
            alpha.json
            updates.json
            qomicex-update-*.zip
            qomicex-update-*.zip.sig
            qomicex-launcher-*/**/*
          fail_on_unmatched_files: false

      - name: Trigger website rebuild
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}

      - name: Sync releases
        run: |
          curl -X POST https://api.qomicex.top/api/internal/releases/sync \
            -H "Authorization: Bearer ${{ secrets.RELEASE_SYNC_TOKEN }}"



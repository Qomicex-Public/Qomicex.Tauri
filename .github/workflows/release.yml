          if [ -n "$DEB" ]; then
            STAGING=$(mktemp -d)
            dpkg-deb -x "$DEB" "$STAGING"
          elif [ -n "$RPM" ]; then
            STAGING=$(mktemp -d)
            (cd "$STAGING" && rpm2cpio "$RPM" | cpio -idm --quiet)
          fi
          if [ -n "$STAGING" ]; then
            PKG_SYS="qomicex-update-linux-x86_64-system.zip"
            (cd "$STAGING" && zip -qr "$OLDPWD/$PKG_SYS" .)
            npx tauri signer sign "$PKG_SYS"
            rm -rf "$STAGING"
            echo "{\"linux-x86_64-system\":{\"url\":\"$URL_BASE/$PKG_SYS\",\"signature\":\"$(tr -d '\n' < "$PKG_SYS.sig")\",\"strategy\":\"system\"}}" > "update-package-fragment-linux-x86_64-system.json"
          else
            echo "::warning::No deb/rpm in bundle; skipping linux-x86_64-system self-update package"
          fi
          cat update-package-fragment-*.json 2>/dev/null || echo "::warning::no self-update package produced for this bundle selection"
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-linux-x64
          path: |
            qomicex-update-*.zip
            qomicex-update-*.zip.sig
      - uses: actions/upload-artifact@v7
        with:
          name: update-package-fragment-${{ github.job }}
          path: update-package-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: update-fragment-${{ github.job }}
          path: update-fragment-*.json
      - uses: actions/upload-artifact@v7
        with:
          name: qomicex-launcher-linux-x64
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm


      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.QOMICEX_PAT }}
      # rust-toolchain.toml 钉住 1.95.0，dtolnay 动作只把 target 装进 stable；
      # cargo 在仓库目录内解析到被钉住的链，交叉 target 缺失会报 E0463。

          APPIMAGE=$(find "$BUNDLE_DIR" -name '*.AppImage' | head -1)
          if [ -n "$APPIMAGE" ]; then
            PKG_APP="qomicex-update-linux-x86_64-appimage.zip"
            zip -j "$PKG_APP" "$APPIMAGE"
            npx tauri signer sign "$PKG_APP"
            echo "{\"linux-x86_64-appimage\":{\"url\":\"$URL_BASE/$PKG_APP\",\"signature\":\"$(tr -d '\n' < "$PKG_APP.sig")\",\"strategy\":\"appimage\"}}" > "update-package-fragment-linux-x86_64-appimage.json"

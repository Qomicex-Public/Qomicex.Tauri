# MAPPING_TABLE.yaml — icon ternary → <MorphIcon> 状态切换图标动画化
# 迁移方向：icon↔icon 三元表达式 → 单一 <MorphIcon icon={cond ? XData : YData}>

# 通用规则（所有文件一致）
morphicon_pattern:
  before: "{cond ? <X className=\"...\" /> : <Y className=\"...\" />}"
  after: "<MorphIcon icon={cond ? XData : YData} className={cn('<shared>', cond && 'animate-spin')} spring=\"snappy\" reducedMotion=\"user\" />"
  notes:
    - spring="snappy" + reducedMotion="user" 每处必带
    - animate-spin 按需放 className（仅 loading/active 态生效），保证 morph 在完成时触发
    - className 其余部分（h/w、颜色、mr 等）原样保留
    - 两分支 className 相同时可不用 cn，直接用字面量

imports:
  lucide_react: "import { X } from 'lucide-react'  # 静态图标保留原样"
  lucide_data: "import { X as XData, Y as YData } from 'lucide'  # Data 后缀别名避免命名冲突"
  morphicon: "import { MorphIcon } from 'morphicons/react'"

# 图标映射：lucide-react 组件 → lucide data 别名
icon_mapping:
  Loader2: Loader2Data
  Play: PlayData
  Wifi: WifiData
  RotateCw: RotateCwData
  Download: DownloadData
  ChevronDown: ChevronDownData
  ChevronRight: ChevronRightData

# 文件级改动清单
files:
  src/pages/Connect.tsx:
    - L203, L226: launching===inst.instanceId ? Loader2Data : PlayData; className=cn('mr-1', cond && 'animate-spin')
    - L505: natTypeBusy ? Loader2Data : WifiData; className=cn('mr-1', cond && 'animate-spin')
    - imports_added: "Loader2Data, PlayData, WifiData (lucide); MorphIcon; cn (../lib/utils.ts, 原无)"
    - lucide_react_removed: Wifi（仅 ternary 使用，转为 WifiData）
    - lucide_react_kept: Loader2, Play（其他位置仍用）
  src/pages/Accounts.tsx:
    - L514: loading ? Loader2Data : RotateCwData; className=cn('h-3.5 w-3.5', cond && 'animate-spin')
    - imports_added: "Loader2Data, RotateCwData (lucide); MorphIcon"
    - lucide_react_removed: RotateCw（仅 ternary 使用）；Loader2 保留（L493 仍用）
  src/components/LogTab.tsx:
    - L282: previewExpanded ? ChevronDownData : ChevronRightData; className 两分支相同用字面量
    - imports_added: "ChevronDownData, ChevronRightData (lucide); MorphIcon"
    - lucide_react_removed: ChevronDown, ChevronRight
  src/components/CrashAnalysisDialog.tsx:
    - L163: exporting ? Loader2Data : DownloadData; className=cn('h-3 w-3', cond && 'animate-spin')
    - imports_added: "DownloadData, Loader2Data (lucide); MorphIcon; cn (../lib/utils.ts, 原无)"
    - lucide_react_removed: Download；Loader2 保留（L127 仍用）
  src/components/DropInstallDialog.tsx:
    - L292, L297: installing ? RotateCwData : DownloadData; className=cn('mr-1.5 h-3.5 w-3.5', cond && 'animate-spin')（两处相同）
    - imports_added: "DownloadData, RotateCwData (lucide); MorphIcon"
    - lucide_react_removed: Download；RotateCw 保留（L233 仍用）
  src/components/ResourceInstallDialog.tsx:
    - L470: starting ? RotateCwData : DownloadData; className=cn('mr-1.5 h-3.5 w-3.5', cond && 'animate-spin')
    - imports_added: "DownloadData, RotateCwData (lucide); MorphIcon"
    - lucide_react_removed: Download；RotateCw 保留（多处仍用）

# 明确不改（非 icon↔icon 切换，维持原样）
not_converted:
  - "Connect.tsx L556/599/618/690：ternary 一侧为 null 或文本，非两图标切换"
  - "静态图标用法（无状态切换）"


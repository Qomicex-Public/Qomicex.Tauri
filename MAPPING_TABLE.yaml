transform_rules:
  - rule: "import"
    detail: "删除 '@fortawesome/react-fontawesome' 与 '@fortawesome/free-solid-svg-icons' 导入，改为 import { A, B, ... } from 'lucide-react'（按 icon_map 取组件名，去重，按字母序）。若文件仍使用品牌图标（faMicrosoft 等），保留 '@fortawesome/react-fontawesome' + '@fortawesome/free-brands-svg-icons' 导入（仅保留实际用到的）。"
  - rule: "jsx"
    detail: "<FontAwesomeIcon icon={faX} className=\"...\" /> → <X className=\"...\" />。保留原 className 原样（Tailwind h/w 类控制尺寸，等价于 FA 行为）。不加 size 属性。"
  - rule: "spin_prop"
    detail: "<FontAwesomeIcon icon={faSpinner} spin ... /> → <Loader2 className=\"animate-spin ...\" />（spin 属性替换为 className 追加 animate-spin）。"
  - rule: "dynamic_icon_array"
    detail: "文件内 `icon: faX`（IconDefinition 引用）形式的数组/对象字段 → 改为存 lucide 组件引用 `icon: X`（引用，不实例化）；渲染处 `<FontAwesomeIcon icon={o.icon} className=\"...\" />` → `<o.icon className=\"...\" />`。"
  - rule: "account_select_dialog_special"
    detail: "Accounts.tsx getAccountIcon(loginMethod) 返回 { icon, color } 中 faMicrosoft/faKeycdn 为品牌保持 FA，faUserLarge 改 CircleUser；将返回类型改为 ReactNode 图标元素（品牌返回 <FontAwesomeIcon icon={faX} className=\"h-2.5 w-2.5\" />，faUserLarge 返回 <CircleUser className=\"h-2.5 w-2.5\" />），调用处 `<span className={cn('h-2.5 w-2.5', icon.color)}>{icon.icon}</span>` 去 class。"
  - rule: "no_size_prop"
    detail: "不要给 lucide 组件加 size/strokeWidth 属性（默认即可），唯一例外：插件 UI 内 `[&_svg]:size-4` 已统一控制 Button 内图标为 16px。"
  - rule: "cleanup"
    detail: "迁移后删除未使用的 import（项目 strict noUnusedLocals，tsc 会报错）。不要改动任何非图标逻辑、className、结构。"
  - rule: "brands_mixed_file"
    detail: "文件同时用 solid+brand（Accounts/Settings/MicrosoftReauthDialog）：solid 全部转 lucide，brand 保留 FA 渲染（保留 FontAwesomeIcon 导入）。"
  - rule: "name_conflict"
    detail: "若 lucide 组件名与文件内已有标识符冲突（如 Settings.tsx 的页面组件 Settings ↔ lucide Settings），用别名导入 `Settings as SettingsIcon`，替换对应 JSX。"
  - rule: "ternary_narrowing"
    detail: "含字符串字面量联合类型的三元（如 `updateState === 'checking' ? faA : faB`、`scanning === 'quick'`）转 JSX 三元时，两分支 className 里的条件表达式会触发 TS2367 窄化报错：true 分支写死 animate-spin，false 分支不写，如 `{cond ? <RotateCw className=\"h-4 w-4 animate-spin\" /> : <Search className=\"h-4 w-4\" />}`。"

verification:
  - "pnpm run build（tsc + vite）通过"
  - "grep 确认：迁移文件内无残留 '<FontAwesomeIcon'（品牌除外）"

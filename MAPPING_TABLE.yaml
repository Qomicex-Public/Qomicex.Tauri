# FA → Lucide 图标迁移映射表（唯一事实源）
# 所有映射决策必须先查本表，新增映射先更新本表再写代码。
migration:
  source_pkg: "@fortawesome/free-solid-svg-icons + @fortawesome/react-fontawesome"
  target_pkg: "lucide-react"
  exception_files:
    - file: "src/components/BuiltinIcons.tsx"
      reason: "插件 fa-* 类名→图标的运行时字符串查找契约，迁移会破坏插件兼容，保持 FA"
    - file: "src/components/PluginIcon.tsx"
      reason: "依赖 BuiltinIcons.resolveFaIcon()，保持 FA"
  exception_brands:
    - faMicrosoft
    - faGithub
    - faJava
    - faKeycdn
    reason: "品牌图标无 Lucide 对应，保留 @fortawesome/free-brands-svg-icons + @fortawesome/react-fontawesome"


# MAPPING_TABLE.yaml — icon ternary → <MorphIcon> 状态切换图标动画化
# 迁移方向：icon↔icon 三元表达式 → 单一 <MorphIcon icon={cond ? XData : YData}>

# 通用规则（所有文件一致）
morphicon_pattern:
  before: "{cond ? <X className=\"...\" /> : <Y className=\"...\" />}"
  after: "<MorphIcon icon={cond ? XData : YData} className={cn('<shared>', cond && 'animate-spin')} spring=\"snappy\" reducedMotion=\"user\" />"
  notes:
    - spring="snappy" + reducedMotion="user" 每处必带
    - animate-spin 按需放 className（仅 loading/active 态生效），保证 morph 在完成时触发
    - className 其余部分（h/w、颜色、mr 等）原样保留
    - 两分支 className 相同时可不用 cn，直接用字面量

imports:
  lucide_react: "import { X } from 'lucide-react'  # 静态图标保留原样"
  lucide_data: "import { X as XData, Y as YData } from 'lucide'  # Data 后缀别名避免命名冲突"
  morphicon: "import { MorphIcon } from 'morphicons/react'"

# 图标映射：lucide-react 组件 → lucide data 别名
icon_mapping:
  Loader2: Loader2Data
  Play: PlayData
  Wifi: WifiData
  RotateCw: RotateCwData
  Download: DownloadData
  ChevronDown: ChevronDownData
  ChevronRight: ChevronRightData

# 文件级改动清单
